<script type="importmap">

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────
// SDF Parser
// ─────────────────────────────────────────────
function parseDSL(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  const operations = [];
  let currentBool = 'union';

  for (const line of lines) {
    if (line === 'subtract') { currentBool = 'subtract'; continue; }
    if (line === 'intersect') { currentBool = 'intersect'; continue; }

    const parts = line.split(/\s+/);
    const type = parts[0];
    const transforms = { rx: 0, ry: 0, rz: 0 };

    const numParts = [];
    for (let i = 1; i < parts.length; i++) {
      const m = parts[i].match(/^(rx|ry|rz):(-?\d+\.?\d*)$/);
      if (m) {
        transforms[m[1]] = parseFloat(m[2]) * Math.PI / 180;
      } else {
        numParts.push(parseFloat(parts[i]));
      }
    }

    let op = null;
    switch (type) {
      case 'sphere':
        if (numParts.length >= 4) {
          op = { type: 'sphere', center: numParts.slice(0, 3), radius: numParts[3], transforms, bool: currentBool };
        }
        break;
      case 'box':
        if (numParts.length >= 6) {
          op = { type: 'box', center: numParts.slice(0, 3), size: numParts.slice(3, 6), transforms, bool: currentBool };
        } else if (numParts.length >= 4) {
          const s = numParts[3];
          op = { type: 'box', center: numParts.slice(0, 3), size: [s, s, s], transforms, bool: currentBool };
        }
        break;
      case 'cylinder':
        if (numParts.length >= 5) {
          op = { type: 'cylinder', center: numParts.slice(0, 3), radius: numParts[3], height: numParts[4], transforms, bool: currentBool };
        }
        break;
      case 'torus':
        if (numParts.length >= 5) {
          op = { type: 'torus', center: numParts.slice(0, 3), R: numParts[3], r: numParts[4], transforms, bool: currentBool };
        }
        break;
      default:
        throw new Error(`Unknown primitive: ${type}`);
    }

    if (op) {
      operations.push(op);
      if (currentBool !== 'union') currentBool = 'union';
    }
  }

  return operations;
}

// ─────────────────────────────────────────────
// SDF Evaluator
// ─────────────────────────────────────────────
function applyRotation(px, py, pz, t) {
  let x = px, y = py, z = pz;
  if (t.rx !== 0) {
    const c = Math.cos(t.rx), s = Math.sin(t.rx);
    const ny = c * y - s * z, nz = s * y + c * z;
    y = ny; z = nz;
  }
  if (t.ry !== 0) {
    const c = Math.cos(t.ry), s = Math.sin(t.ry);
    const nx = c * x + s * z, nz = -s * x + c * z;
    x = nx; z = nz;
  }
  if (t.rz !== 0) {
    const c = Math.cos(t.rz), s = Math.sin(t.rz);
    const nx = c * x - s * y, ny = s * x + c * y;
    x = nx; y = ny;
  }
  return [x, y, z];
}

function sdfPrimitive(px, py, pz, op) {
  let lx = px - op.center[0];
  let ly = py - op.center[1];
  let lz = pz - op.center[2];
  if (op.transforms.rx || op.transforms.ry || op.transforms.rz) {
    [lx, ly, lz] = applyRotation(lx, ly, lz, {
      rx: -op.transforms.rx, ry: -op.transforms.ry, rz: -op.transforms.rz
    });
  }
  switch (op.type) {
    case 'sphere':
      return Math.sqrt(lx * lx + ly * ly + lz * lz) - op.radius;
    case 'box': {
      const dx = Math.abs(lx) - op.size[0];
      const dy = Math.abs(ly) - op.size[1];
      const dz = Math.abs(lz) - op.size[2];
      return Math.sqrt(Math.max(dx, 0) ** 2 + Math.max(dy, 0) ** 2 + Math.max(dz, 0) ** 2) + Math.min(Math.max(dx, dy, dz), 0);
    }
    case 'cylinder': {
      const h = op.height / 2;
      const d = Math.sqrt(lx * lx + lz * lz) - op.radius;
      const dy = Math.abs(ly) - h;
      return Math.sqrt(Math.max(d, 0) ** 2 + Math.max(dy, 0) ** 2) + Math.min(Math.max(d, dy), 0);
    }
    case 'torus': {
      const qx = Math.sqrt(lx * lx + lz * lz) - op.R;
      return Math.sqrt(qx * qx + ly * ly) - op.r;
    }
    default: return 1e10;
  }
}

function evaluateSDF(px, py, pz, operations) {
  if (operations.length === 0) return 1e10;
  let d = sdfPrimitive(px, py, pz, operations[0]);
  for (let i = 1; i < operations.length; i++) {
    const op = operations[i];
    const di = sdfPrimitive(px, py, pz, op);
    switch (op.bool) {
      case 'union':     d = Math.min(d, di); break;
      case 'subtract':  d = Math.max(d, -di); break;
      case 'intersect': d = Math.max(d, di); break;
    }
  }
  return d;
}

// ─────────────────────────────────────────────
// Per-Part Grouping
// ─────────────────────────────────────────────
function groupIntoParts(operations) {
  const parts = [];
  let current = null;
  for (const op of operations) {
    if (op.bool === 'union') {
      current = [op];
      parts.push(current);
    } else {
      if (current) current.push(op);
    }
  }
  return parts;
}

function computePartBounds(part) {
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (const op of part) {
    if (op.bool === 'subtract') continue;
    const c = op.center;
    let r = 0;
    switch (op.type) {
      case 'sphere': r = op.radius; break;
      case 'box': r = Math.max(op.size[0], op.size[1], op.size[2]); break;
      case 'cylinder': r = Math.max(op.radius, op.height / 2); break;
      case 'torus': r = op.R + op.r; break;
    }
    r *= 1.3;
    minX = Math.min(minX, c[0] - r); minY = Math.min(minY, c[1] - r); minZ = Math.min(minZ, c[2] - r);
    maxX = Math.max(maxX, c[0] + r); maxY = Math.max(maxY, c[1] + r); maxZ = Math.max(maxZ, c[2] + r);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2, cz = (minZ + maxZ) / 2;
  const half = Math.max(maxX - minX, maxY - minY, maxZ - minZ) / 2 + 0.05;
  return [[cx - half, cy - half, cz - half], [cx + half, cy + half, cz + half]];
}

// ─────────────────────────────────────────────
// Parametric Mesh Generators
// ─────────────────────────────────────────────
function nearestPow2(n) { let p = 4; while (p < n) p *= 2; return p; }

function applyTransformToVerts(verts, cx, cy, cz, t) {
  if (!t.rx && !t.ry && !t.rz) return;
  for (let i = 0; i < verts.length; i += 3) {
    let x = verts[i] - cx, y = verts[i+1] - cy, z = verts[i+2] - cz;
    [x, y, z] = applyRotation(x, y, z, t);
    verts[i] = x + cx; verts[i+1] = y + cy; verts[i+2] = z + cz;
  }
}

function connectRings(topStart, topSegs, botStart, botSegs, idxs) {
  if (topSegs === botSegs) {
    for (let s = 0; s < topSegs; s++) {
      const t0 = topStart + s, t1 = topStart + (s + 1) % topSegs;
      const b0 = botStart + s, b1 = botStart + (s + 1) % botSegs;
      idxs.push(t0, b0, t1); idxs.push(t1, b0, b1);
    }
  } else if (botSegs === topSegs * 2) {
    for (let s = 0; s < topSegs; s++) {
      const t0 = topStart + s, t1 = topStart + (s + 1) % topSegs;
      const b0 = botStart + (2 * s), b1 = botStart + (2 * s + 1), b2 = botStart + (2 * s + 2) % botSegs;
      idxs.push(t0, b0, b1); idxs.push(t0, b1, t1); idxs.push(t1, b1, b2);
    }
  } else if (topSegs === botSegs * 2) {
    for (let s = 0; s < botSegs; s++) {
      const b0 = botStart + s, b1 = botStart + (s + 1) % botSegs;
      const t0 = topStart + (2 * s), t1 = topStart + (2 * s + 1), t2 = topStart + (2 * s + 2) % topSegs;
      idxs.push(t0, b0, t1); idxs.push(t1, b0, b1); idxs.push(t1, b1, t2);
    }
  }
}

function generateParametricSphere(op, resolution) {
  const [cx, cy, cz] = op.center;
  const radius = op.radius;
  const verts = [], idxs = [];
  const maxSegs = nearestPow2(Math.max(8, Math.min(resolution, 64)));
  const latBands = Math.max(8, Math.floor(resolution / 2));
  verts.push(cx, cy + radius, cz);
  const ringData = [];
  for (let lat = 1; lat < latBands; lat++) {
    const phi = Math.PI * lat / latBands;
    const sinPhi = Math.sin(phi), cosPhi = Math.cos(phi);
    let segs = 4;
    while (segs * 2 <= maxSegs && segs < maxSegs * sinPhi * 1.3) segs *= 2;
    const startIdx = verts.length / 3;
    for (let s = 0; s < segs; s++) {
      const theta = 2 * Math.PI * s / segs;
      verts.push(cx + radius * sinPhi * Math.cos(theta), cy + radius * cosPhi, cz + radius * sinPhi * Math.sin(theta));
    }
    ringData.push({ startIdx, segs });
  }
  const southIdx = verts.length / 3;
  verts.push(cx, cy - radius, cz);
  if (ringData.length > 0) {
    const first = ringData[0];
    for (let s = 0; s < first.segs; s++) idxs.push(0, first.startIdx + s, first.startIdx + (s + 1) % first.segs);
  }
  for (let r = 0; r < ringData.length - 1; r++) {
    connectRings(ringData[r].startIdx, ringData[r].segs, ringData[r+1].startIdx, ringData[r+1].segs, idxs);
  }
  if (ringData.length > 0) {
    const last = ringData[ringData.length - 1];
    for (let s = 0; s < last.segs; s++) idxs.push(last.startIdx + (s + 1) % last.segs, last.startIdx + s, southIdx);
  }
  applyTransformToVerts(verts, cx, cy, cz, op.transforms);
  return { vertices: new Float32Array(verts), indices: new Uint32Array(idxs) };
}

function generateParametricCylinder(op, resolution) {
  const [cx, cy, cz] = op.center;
  const r = op.radius, halfH = op.height / 2;
  const segs = Math.max(8, resolution);
  const heightDivs = Math.max(1, Math.floor(resolution / 8));
  const verts = [], idxs = [];
  verts.push(cx, cy + halfH, cz);
  const ringStarts = [];
  for (let h = 0; h <= heightDivs; h++) {
    const y = cy + halfH - (h / heightDivs) * op.height;
    const startIdx = verts.length / 3;
    for (let s = 0; s < segs; s++) {
      const theta = 2 * Math.PI * s / segs;
      verts.push(cx + r * Math.cos(theta), y, cz + r * Math.sin(theta));
    }
    ringStarts.push(startIdx);
  }
  const botCenter = verts.length / 3;
  verts.push(cx, cy - halfH, cz);
  for (let s = 0; s < segs; s++) idxs.push(0, ringStarts[0] + (s + 1) % segs, ringStarts[0] + s);
  for (let h = 0; h < heightDivs; h++) {
    for (let s = 0; s < segs; s++) {
      const t0 = ringStarts[h] + s, t1 = ringStarts[h] + (s + 1) % segs;
      const b0 = ringStarts[h+1] + s, b1 = ringStarts[h+1] + (s + 1) % segs;
      idxs.push(t0, t1, b1); idxs.push(t0, b1, b0);
    }
  }
  const lastRing = ringStarts[heightDivs];
  for (let s = 0; s < segs; s++) idxs.push(botCenter, lastRing + s, lastRing + (s + 1) % segs);
  applyTransformToVerts(verts, cx, cy, cz, op.transforms);
  return { vertices: new Float32Array(verts), indices: new Uint32Array(idxs) };
}

function generateParametricBox(op, resolution) {
  const [cx, cy, cz] = op.center;
  const [sx, sy, sz] = op.size;
  const verts = [], idxs = [];
  const divs = Math.max(1, Math.floor(resolution / 16));
  function addFace(origin, uAxis, vAxis, uLen, vLen) {
    const baseIdx = verts.length / 3;
    for (let v = 0; v <= divs; v++) {
      for (let u = 0; u <= divs; u++) {
        const fu = u / divs, fv = v / divs;
        verts.push(
          origin[0] + uAxis[0] * uLen * fu + vAxis[0] * vLen * fv,
          origin[1] + uAxis[1] * uLen * fu + vAxis[1] * vLen * fv,
          origin[2] + uAxis[2] * uLen * fu + vAxis[2] * vLen * fv
        );
      }
    }
    const stride = divs + 1;
    for (let v = 0; v < divs; v++) {
      for (let u = 0; u < divs; u++) {
        const a = baseIdx + v * stride + u, b = a + 1, c = a + stride + 1, d = a + stride;
        idxs.push(a, b, c); idxs.push(a, c, d);
      }
    }
  }
  addFace([cx-sx, cy-sy, cz+sz], [1,0,0], [0,1,0], 2*sx, 2*sy);
  addFace([cx+sx, cy-sy, cz-sz], [-1,0,0], [0,1,0], 2*sx, 2*sy);
  addFace([cx-sx, cy+sy, cz-sz], [1,0,0], [0,0,1], 2*sx, 2*sz);
  addFace([cx-sx, cy-sy, cz+sz], [1,0,0], [0,0,-1], 2*sx, 2*sz);
  addFace([cx+sx, cy-sy, cz-sz], [0,0,1], [0,1,0], 2*sz, 2*sy);
  addFace([cx-sx, cy-sy, cz+sz], [0,0,-1], [0,1,0], 2*sz, 2*sy);
  applyTransformToVerts(verts, cx, cy, cz, op.transforms);
  return { vertices: new Float32Array(verts), indices: new Uint32Array(idxs) };
}

function generateParametricTorus(op, resolution) {
  const [cx, cy, cz] = op.center;
  const R = op.R, r = op.r;
  const majorSegs = Math.max(8, resolution), minorSegs = Math.max(6, Math.floor(resolution * 0.6));
  const verts = [], idxs = [];
  for (let i = 0; i < majorSegs; i++) {
    const theta = 2 * Math.PI * i / majorSegs;
    const cosT = Math.cos(theta), sinT = Math.sin(theta);
    for (let j = 0; j < minorSegs; j++) {
      const phi = 2 * Math.PI * j / minorSegs;
      verts.push(cx + (R + r * Math.cos(phi)) * cosT, cy + r * Math.sin(phi), cz + (R + r * Math.cos(phi)) * sinT);
    }
  }
  for (let i = 0; i < majorSegs; i++) {
    const ni = (i + 1) % majorSegs;
    for (let j = 0; j < minorSegs; j++) {
      const nj = (j + 1) % minorSegs;
      const a = i * minorSegs + j, b = ni * minorSegs + j, c = ni * minorSegs + nj, d = i * minorSegs + nj;
      idxs.push(a, b, c); idxs.push(a, c, d);
    }
  }
  applyTransformToVerts(verts, cx, cy, cz, op.transforms);
  return { vertices: new Float32Array(verts), indices: new Uint32Array(idxs) };
}

function canUseParametric(part) { return part.length === 1 && part[0].bool === 'union'; }

function generateParametricMesh(op, resolution) {
  switch (op.type) {
    case 'sphere':   return generateParametricSphere(op, resolution);
    case 'cylinder': return generateParametricCylinder(op, resolution);
    case 'box':      return generateParametricBox(op, resolution);
    case 'torus':    return generateParametricTorus(op, resolution);
    default:         return null;
  }
}

// ─────────────────────────────────────────────
// Vertex Welding
// ─────────────────────────────────────────────
function weldMeshes(meshes, threshold) {
  const allVerts = [], allIndices = [];
  let vertexOffset = 0;
  for (const mesh of meshes) {
    const vCount = mesh.vertices.length / 3;
    for (let i = 0; i < mesh.vertices.length; i++) allVerts.push(mesh.vertices[i]);
    for (let i = 0; i < mesh.indices.length; i++) allIndices.push(mesh.indices[i] + vertexOffset);
    vertexOffset += vCount;
  }
  const totalVerts = allVerts.length / 3;
  const cellSize = threshold * 10;
  const grid = new Map();
  function cellKey(x, y, z) {
    return `${Math.floor(x / cellSize)},${Math.floor(y / cellSize)},${Math.floor(z / cellSize)}`;
  }
  const remap = new Int32Array(totalVerts);
  const finalVerts = [];
  let finalCount = 0;
  const threshSq = threshold * threshold;
  for (let i = 0; i < totalVerts; i++) {
    const x = allVerts[i * 3], y = allVerts[i * 3 + 1], z = allVerts[i * 3 + 2];
    const cx = Math.floor(x / cellSize), cy = Math.floor(y / cellSize), cz = Math.floor(z / cellSize);
    let merged = -1;
    outer:
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dz = -1; dz <= 1; dz++) {
          const cell = grid.get(`${cx + dx},${cy + dy},${cz + dz}`);
          if (!cell) continue;
          for (const candidate of cell) {
            const fx = finalVerts[candidate * 3] - x, fy = finalVerts[candidate * 3 + 1] - y, fz = finalVerts[candidate * 3 + 2] - z;
            if (fx * fx + fy * fy + fz * fz <= threshSq) { merged = candidate; break outer; }
          }
        }
      }
    }
    if (merged >= 0) {
      remap[i] = merged;
    } else {
      const vi = finalCount++;
      remap[i] = vi;
      finalVerts.push(x, y, z);
      const key = cellKey(x, y, z);
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push(vi);
    }
  }
  const finalIndices = [];
  for (let i = 0; i < allIndices.length; i += 3) {
    const a = remap[allIndices[i]], b = remap[allIndices[i + 1]], c = remap[allIndices[i + 2]];
    if (a !== b && b !== c && a !== c) finalIndices.push(a, b, c);
  }
  return { vertices: new Float32Array(finalVerts), indices: new Uint32Array(finalIndices), originalVertCount: totalVerts, weldedVertCount: finalCount };
}

// ─────────────────────────────────────────────
// Marching Cubes
// ─────────────────────────────────────────────
const EDGE_TABLE = [
  0x0,0x109,0x203,0x30a,0x406,0x50f,0x605,0x70c,0x80c,0x905,0xa0f,0xb06,0xc0a,0xd03,0xe09,0xf00,

const TRI_TABLE = new Array(256);
(function initTriTable() {

function marchingCubes(sdfFn, resolution, bounds) {
  const [minB, maxB] = bounds;
  const step = (maxB[0] - minB[0]) / resolution;
  const vertices = [], indices = [];
  const size = resolution + 1;
  const field = new Float32Array(size * size * size);
  for (let z = 0; z < size; z++)
    for (let y = 0; y < size; y++)
      for (let x = 0; x < size; x++)
        field[x + y * size + z * size * size] = sdfFn(minB[0] + x * step, minB[1] + y * step, minB[2] + z * step);

  const idx = (x, y, z) => x + y * size + z * size * size;
  function interp(x1, y1, z1, v1, x2, y2, z2, v2) {
    if (Math.abs(v1) < 1e-6) return [x1, y1, z1];
    if (Math.abs(v2) < 1e-6) return [x2, y2, z2];
    if (Math.abs(v1 - v2) < 1e-6) return [x1, y1, z1];
    const t = -v1 / (v2 - v1);
    return [x1 + t * (x2 - x1), y1 + t * (y2 - y1), z1 + t * (z2 - z1)];
  }
  const vertCache = new Map();
  function getVertex(x1, y1, z1, v1, x2, y2, z2, v2, edgeKey) {
    const cached = vertCache.get(edgeKey);
    if (cached !== undefined) return cached;
    const p = interp(x1, y1, z1, v1, x2, y2, z2, v2);
    const vi = vertices.length / 3;
    vertices.push(p[0], p[1], p[2]);
    vertCache.set(edgeKey, vi);
    return vi;
  }

  for (let z = 0; z < resolution; z++) {
    for (let y = 0; y < resolution; y++) {
      for (let x = 0; x < resolution; x++) {
        const px = minB[0] + x * step, py = minB[1] + y * step, pz = minB[2] + z * step;
        const v = [
          field[idx(x, y, z)], field[idx(x+1, y, z)], field[idx(x+1, y, z+1)], field[idx(x, y, z+1)],
          field[idx(x, y+1, z)], field[idx(x+1, y+1, z)], field[idx(x+1, y+1, z+1)], field[idx(x, y+1, z+1)]
        ];
        let cubeIndex = 0;
        for (let i = 0; i < 8; i++) if (v[i] < 0) cubeIndex |= (1 << i);
        if (EDGE_TABLE[cubeIndex] === 0) continue;
        const corners = [
          [px, py, pz], [px+step, py, pz], [px+step, py, pz+step], [px, py, pz+step],
          [px, py+step, pz], [px+step, py+step, pz], [px+step, py+step, pz+step], [px, py+step, pz+step]
        ];
        const edgePairs = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
        const cornerKeys = [
          x+y*size+z*size*size, (x+1)+y*size+z*size*size, (x+1)+y*size+(z+1)*size*size, x+y*size+(z+1)*size*size,
          x+(y+1)*size+z*size*size, (x+1)+(y+1)*size+z*size*size, (x+1)+(y+1)*size+(z+1)*size*size, x+(y+1)*size+(z+1)*size*size
        ];
        const edgeVerts = new Array(12);
        for (let i = 0; i < 12; i++) {
          if (EDGE_TABLE[cubeIndex] & (1 << i)) {
            const [a, b] = edgePairs[i];
            const ka = cornerKeys[a], kb = cornerKeys[b];
            const edgeKey = ka < kb ? ka * size * size * size + kb : kb * size * size * size + ka;
            edgeVerts[i] = getVertex(corners[a][0], corners[a][1], corners[a][2], v[a], corners[b][0], corners[b][1], corners[b][2], v[b], edgeKey);
          }
        }
        const tri = TRI_TABLE[cubeIndex];
        for (let i = 0; i < tri.length; i += 3) indices.push(edgeVerts[tri[i]], edgeVerts[tri[i+1]], edgeVerts[tri[i+2]]);
      }
    }
  }
  return { vertices: new Float32Array(vertices), indices: new Uint32Array(indices) };
}

const meshMaterial = new THREE.MeshStandardMaterial({
  color: 0xd8d4cc, roughness: 0.55, metalness: 0.05, flatShading: true, side: THREE.DoubleSide
});

let currentMesh = null;
const statusMsg = document.getElementById('status-msg');

function generateMesh(code) {
  // Clear previous
  if (currentMesh) { scene.remove(currentMesh); currentMesh.geometry.dispose(); currentMesh = null; }

  let operations;
  try {
    operations = parseDSL(code);
  } catch (e) {
    statusMsg.textContent = e.message;
    statusMsg.classList.add('error');
    return;
  }

  if (operations.length === 0) {
    statusMsg.textContent = 'No primitives defined';
    statusMsg.classList.add('error');
    return;
  }

  statusMsg.textContent = 'Generating...';
  statusMsg.classList.remove('error');

  const parts = groupIntoParts(operations);
  const partMeshes = [];

  for (const part of parts) {
    let partResult;
    if (canUseParametric(part)) {
      partResult = generateParametricMesh(part[0], RESOLUTION);
    }
    if (!partResult) {
      const partBounds = computePartBounds(part);
      const partSdf = (x, y, z) => evaluateSDF(x, y, z, part);
      partResult = marchingCubes(partSdf, RESOLUTION, partBounds);
    }
    if (partResult && partResult.indices.length > 0) partMeshes.push(partResult);
  }

  const welded = weldMeshes(partMeshes, 0.0001);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(welded.vertices, 3));
  geometry.setIndex(new THREE.BufferAttribute(welded.indices, 1));
  geometry.computeVertexNormals();

  currentMesh = new THREE.Mesh(geometry, meshMaterial);
  scene.add(currentMesh);

  statusMsg.textContent = `Ready — ${welded.weldedVertCount} verts, ${welded.indices.length / 3} tris`;
  statusMsg.classList.remove('error');

  renderer.render(scene, camera);
}

window.sdfSetCode = (code) => {

  camera.position.set(x, y, z);
  camera.lookAt(0, 0.7, 0);
  renderer.render(scene, camera);
};

window.getRendererCanvas = () => {
  renderer.render(scene, camera);
  return renderer.domElement;
};

window.resetCamera = () => {
  camera.position.set(2.5, 2.2, 3);
  camera.lookAt(0, 0.7, 0);
  renderer.render(scene, camera);
};

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
