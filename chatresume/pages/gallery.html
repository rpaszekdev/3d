<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatResume — Template Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --brand: #1d4ed8;
      --brand-light: #3b82f6;
      --brand-dark: #1e3a8a;
      --dark: #0f172a;
      --dark-muted: #1e293b;
      --text: #0f172a;
      --text-muted: #64748b;
      --surface: #ffffff;
      --surface-warm: #fafaf9;
      --surface-cool: #f8fafc;
      --accent: #f59e0b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-sm: 8px;
      --radius-lg: 24px;
    }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--surface-cool);
      overflow-x: hidden;
    }

    /* Grain texture overlay */
    #page-gallery::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px 200px;
    }

    #page-gallery {
      position: relative;
      min-height: 100vh;
    }

    /* ── Top Bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .topbar__logo {
      font-family: "Instrument Serif", serif;
      font-size: 1.5rem;
      color: var(--dark);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .topbar__title {
      font-family: "DM Sans", sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .topbar__back {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--brand);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .topbar__back:hover {
      color: var(--brand-dark);
    }

    /* ── Main Content ── */
    .gallery-content {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 40px 80px;
    }

    /* ── Filter Tabs ── */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 10px 22px;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-family: "DM Sans", sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .filter-pill:hover {
      border-color: var(--brand-light);
      color: var(--brand);
      background: rgba(29, 78, 216, 0.04);
    }

    .filter-pill.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    /* ── Card Grid ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* ── Template Card ── */
    .template-card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(24px);
    }

    .template-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .template-card.hidden {
      opacity: 0;
      transform: scale(0.92) translateY(12px);
      pointer-events: none;
      position: absolute;
      visibility: hidden;
    }

    .template-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.10), 0 8px 16px rgba(15, 23, 42, 0.06);
      border-color: var(--brand-light);
    }

    /* Popular badge */
    .badge-popular {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 100px;
    }

    /* ── CV Preview Area ── */
    .cv-preview {
      position: relative;
      aspect-ratio: 8.5 / 11;
      background: var(--surface-warm);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Hover overlay */
    .cv-preview__overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .template-card:hover .cv-preview__overlay {
      opacity: 1;
    }

    .cv-preview__overlay span {
      font-family: "DM Sans", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 10px 24px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* ── Mini Document Previews ── */
    .mini-doc {
      width: 65%;
      aspect-ratio: 8.5 / 11;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      padding: 12%;
      position: relative;
      overflow: hidden;
    }

    /* -- Clean: minimal horizontal lines -- */
    .mini-doc--clean .doc-header {
      width: 50%;
      height: 6%;
      background: var(--dark);
      border-radius: 2px;
      margin-bottom: 6%;
    }
    .mini-doc--clean .doc-subtitle {
      width: 35%;
      height: 3%;
      background: var(--text-muted);
      border-radius: 2px;
      margin-bottom: 10%;
      opacity: 0.5;
    }
    .mini-doc--clean .doc-line {
      width: 100%;
      height: 3%;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 5%;
    }
    .mini-doc--clean .doc-line:nth-child(5) { width: 85%; }
    .mini-doc--clean .doc-line:nth-child(7) { width: 70%; }
    .mini-doc--clean .doc-section {
      width: 30%;
      height: 3.5%;
      background: var(--dark);
      border-radius: 2px;
      margin-top: 8%;
      margin-bottom: 6%;
      opacity: 0.7;
    }

    /* -- Sidebar: vertical bar + lines -- */
    .mini-doc--sidebar {
      padding: 0;
      display: flex;
    }
    .mini-doc--sidebar .doc-sidebar {
      width: 32%;
      height: 100%;
      background: var(--brand-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16%;
      gap: 5%;
    }
    .mini-doc--sidebar .doc-sidebar .avatar {
      width: 50%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }
    .mini-doc--sidebar .doc-sidebar .side-line {
      width: 60%;
      height: 2.5%;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
    }
    .mini-doc--sidebar .doc-sidebar .side-line:nth-child(even) {
      width: 45%;
      opacity: 0.6;
    }
    .mini-doc--sidebar .doc-main {
      flex: 1;
      padding: 12%;
      display: flex;
      flex-direction: column;
    }
    .mini-doc--sidebar .doc-main .main-title {
      width: 70%;
      height: 5%;
      background: var(--dark);
      border-radius: 2px;
      margin-bottom: 4%;
    }
    .mini-doc--sidebar .doc-main .main-line {
      width: 100%;
      height: 2.5%;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 3.5%;
    }
    .mini-doc--sidebar .doc-main .main-line:nth-child(odd) { width: 90%; }
    .mini-doc--sidebar .doc-main .main-section {
      width: 45%;
      height: 3.5%;
      background: var(--brand);
      border-radius: 2px;
      margin-top: 6%;
      margin-bottom: 4%;
      opacity: 0.7;
    }

    /* -- Modern: bold header band + sections -- */
    .mini-doc--modern {
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .mini-doc--modern .doc-band {
      width: 100%;
      height: 22%;
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark-muted) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 12%;
    }
    .mini-doc--modern .doc-band .band-name {
      width: 55%;
      height: 14%;
      background: #fff;
      border-radius: 2px;
      margin-bottom: 6%;
    }
    .mini-doc--modern .doc-band .band-role {
      width: 35%;
      height: 8%;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
    }
    .mini-doc--modern .doc-body {
      flex: 1;
      padding: 10%;
      display: flex;
      flex-direction: column;
    }
    .mini-doc--modern .doc-body .body-section {
      width: 35%;
      height: 3%;
      background: var(--dark);
      border-radius: 2px;
      margin-bottom: 4%;
      opacity: 0.8;
    }
    .mini-doc--modern .doc-body .body-line {
      width: 100%;
      height: 2.5%;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 3%;
    }
    .mini-doc--modern .doc-body .body-line:nth-child(even) { width: 80%; }
    .mini-doc--modern .doc-body .body-spacer {
      height: 5%;
    }

    /* -- ATS Max: dense text, no frills -- */
    .mini-doc--ats {
      padding: 10%;
    }
    .mini-doc--ats .ats-name {
      width: 60%;
      height: 5%;
      background: var(--dark);
      border-radius: 1px;
      margin: 0 auto 2%;
      text-align: center;
    }
    .mini-doc--ats .ats-contact {
      width: 80%;
      height: 2.5%;
      background: var(--text-muted);
      opacity: 0.4;
      border-radius: 1px;
      margin: 0 auto 4%;
    }
    .mini-doc--ats .ats-divider {
      width: 100%;
      height: 1px;
      background: var(--dark);
      margin-bottom: 4%;
    }
    .mini-doc--ats .ats-heading {
      width: 30%;
      height: 3%;
      background: var(--dark);
      border-radius: 1px;
      margin-bottom: 3%;
      text-transform: uppercase;
      font-weight: 700;
    }
    .mini-doc--ats .ats-line {
      width: 100%;
      height: 2.2%;
      background: var(--border);
      border-radius: 1px;
      margin-bottom: 2%;
    }
    .mini-doc--ats .ats-line:nth-child(odd) { width: 95%; }
    .mini-doc--ats .ats-line.short { width: 65%; }

    /* -- Creative: two-column colorful -- */
    .mini-doc--creative {
      padding: 0;
      display: flex;
    }
    .mini-doc--creative .creative-left {
      width: 45%;
      height: 100%;
      background: linear-gradient(180deg, #6366f1 0%, #8b5cf6 100%);
      padding: 14% 8%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4%;
    }
    .mini-doc--creative .creative-left .cr-avatar {
      width: 55%;
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.2);
    }
    .mini-doc--creative .creative-left .cr-name {
      width: 80%;
      height: 3%;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 2px;
    }
    .mini-doc--creative .creative-left .cr-tag {
      width: 50%;
      height: 6%;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.15);
    }
    .mini-doc--creative .creative-left .cr-side-line {
      width: 70%;
      height: 2%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
    .mini-doc--creative .creative-right {
      flex: 1;
      padding: 12% 10%;
      display: flex;
      flex-direction: column;
    }
    .mini-doc--creative .creative-right .cr-heading {
      width: 50%;
      height: 3%;
      background: #6366f1;
      border-radius: 2px;
      margin-bottom: 4%;
    }
    .mini-doc--creative .creative-right .cr-line {
      width: 100%;
      height: 2.2%;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 3%;
    }
    .mini-doc--creative .creative-right .cr-line:nth-child(even) { width: 85%; }
    .mini-doc--creative .creative-right .cr-spacer {
      height: 5%;
    }

    /* -- Executive: elegant serif -- */
    .mini-doc--executive {
      padding: 12%;
      border-top: 6px solid var(--dark);
    }
    .mini-doc--executive .exec-name {
      width: 65%;
      height: 5%;
      background: var(--dark);
      border-radius: 1px;
      margin-bottom: 2%;
    }
    .mini-doc--executive .exec-role {
      width: 40%;
      height: 2.5%;
      background: var(--text-muted);
      border-radius: 1px;
      margin-bottom: 5%;
      opacity: 0.5;
    }
    .mini-doc--executive .exec-divider {
      width: 20%;
      height: 2px;
      background: var(--accent);
      margin-bottom: 6%;
    }
    .mini-doc--executive .exec-section {
      width: 25%;
      height: 2.5%;
      background: var(--dark);
      border-radius: 1px;
      margin-bottom: 4%;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .mini-doc--executive .exec-line {
      width: 100%;
      height: 2.5%;
      background: var(--border);
      border-radius: 1px;
      margin-bottom: 3%;
    }
    .mini-doc--executive .exec-line:nth-child(even) { width: 88%; }
    .mini-doc--executive .exec-line.indented {
      width: 90%;
      margin-left: 5%;
    }

    /* ── Card Info ── */
    .card-info {
      padding: 20px 22px 22px;
    }

    .card-info__name {
      font-family: "Instrument Serif", serif;
      font-size: 1.2rem;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .card-info__stars {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
    }

    .star {
      font-size: 0.9rem;
      color: var(--accent);
    }

    .star.empty {
      opacity: 0.28;
    }

    .card-info__btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: 100px;
      background: var(--brand);
      color: #fff;
      font-family: "DM Sans", sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .card-info__btn:hover {
      background: var(--brand-dark);
      transform: translateX(2px);
    }

    .card-info__btn .arrow {
      transition: transform 0.25s ease;
    }

    .card-info__btn:hover .arrow {
      transform: translateX(3px);
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .gallery-content {
        padding: 36px 24px 64px;
      }
      .topbar {
        padding: 14px 24px;
      }
    }

    @media (max-width: 560px) {
      .card-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .gallery-content {
        padding: 28px 16px 48px;
      }
      .topbar {
        padding: 12px 16px;
      }
      .topbar__title {
        display: none;
      }
      .filter-bar {
        gap: 6px;
      }
      .filter-pill {
        padding: 8px 16px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

<section id="page-gallery" class="page">

  <!-- Top Bar -->
  <header class="topbar">
    <a href="#" class="topbar__logo">ChatResume</a>
    <span class="topbar__title">Templates</span>
    <button class="topbar__back" data-navigate="dashboard">&larr; Dashboard</button>
  </header>

  <div class="gallery-content">

    <!-- Filter Tabs -->
    <div class="filter-bar">
      <button class="filter-pill active" data-filter="all">All</button>
      <button class="filter-pill" data-filter="minimal">Minimal</button>
      <button class="filter-pill" data-filter="creative">Creative</button>
      <button class="filter-pill" data-filter="ats-optimized">ATS-Optimized</button>
    </div>

    <!-- Card Grid -->
    <div class="card-grid">

      <!-- 1. Clean — minimal -->
      <article class="template-card" data-category="minimal">
        <div class="cv-preview">
          <div class="mini-doc mini-doc--clean">
            <div class="doc-header"></div>
            <div class="doc-subtitle"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
            <div class="doc-section"></div>
            <div class="doc-line"></div>
            <div class="doc-line"></div>
          </div>
          <div class="cv-preview__overlay"><span>Preview</span></div>
        </div>
        <div class="card-info">
          <h3 class="card-info__name">Clean</h3>
          <div class="card-info__stars">
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star empty">&#9733;</span>
          </div>
          <button class="card-info__btn" data-navigate="editor">Use this <span class="arrow">&rarr;</span></button>
        </div>
      </article>

      <!-- 2. Sidebar — creative, 5 stars, Popular -->
      <article class="template-card" data-category="creative">
        <span class="badge-popular">Popular</span>
        <div class="cv-preview">
          <div class="mini-doc mini-doc--sidebar">
            <div class="doc-sidebar">
              <div class="avatar"></div>
              <div class="side-line"></div>
              <div class="side-line"></div>
              <div class="side-line"></div>
              <div class="side-line"></div>
              <div class="side-line"></div>
            </div>
            <div class="doc-main">
              <div class="main-title"></div>
              <div class="main-line"></div>
              <div class="main-line"></div>
              <div class="main-line"></div>
              <div class="main-section"></div>
              <div class="main-line"></div>
              <div class="main-line"></div>
              <div class="main-line"></div>
            </div>
          </div>
          <div class="cv-preview__overlay"><span>Preview</span></div>
        </div>
        <div class="card-info">
          <h3 class="card-info__name">Sidebar</h3>
          <div class="card-info__stars">
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
          </div>
          <button class="card-info__btn" data-navigate="editor">Use this <span class="arrow">&rarr;</span></button>
        </div>
      </article>

      <!-- 3. Modern — minimal -->
      <article class="template-card" data-category="minimal">
        <div class="cv-preview">
          <div class="mini-doc mini-doc--modern">
            <div class="doc-band">
              <div class="band-name"></div>
              <div class="band-role"></div>
            </div>
            <div class="doc-body">
              <div class="body-section"></div>
              <div class="body-line"></div>
              <div class="body-line"></div>
              <div class="body-line"></div>
              <div class="body-spacer"></div>
              <div class="body-section"></div>
              <div class="body-line"></div>
              <div class="body-line"></div>
            </div>
          </div>
          <div class="cv-preview__overlay"><span>Preview</span></div>
        </div>
        <div class="card-info">
          <h3 class="card-info__name">Modern</h3>
          <div class="card-info__stars">
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star">&#9733;</span>
            <span class="star empty">&#9733;</span>
          </div>
          <button class="card-info__btn" data-navigate="editor">Use this <span class="arrow">&rarr;</span></button>
        </div>
      </article>

      <!-- 4. ATS Max — ats-optimized, 5 stars, Popular -->
      <article class="template-card" data-category="ats-optimized">
        <span class="badge-popular">Popular</span>
        <div class="cv-preview">
          <div class="mini-doc mini-doc--ats">
            <div class="ats-name"></div>
            <div class="ats-contact"></div>
            <div class="ats-divider"></div>
            <div class="ats-heading"></div>
            <div class="ats-line"></div>
            <div class="ats-line"></div>
            <div class="ats-line short"></div>
            <div class="ats-divider"></div>
            <div class="ats-heading"></div>
            <div class="ats-line"></div>
            <div class="ats-line"></div>
            <div class="ats-line"></div>

<script>
(function () {
  'use strict';

  // ── Filter Logic ──
  const pills = document.querySelectorAll('.filter-pill');
  const cards = document.querySelectorAll('.template-card');

  function filterCards(category) {
    cards.forEach(function (card) {
      const match = category === 'all' || card.dataset.category === category;
      if (match) {
        card.classList.remove('hidden');
        card.classList.add('visible');
      } else {
        card.classList.remove('visible');
        card.classList.add('hidden');
      }
    });
  }

  pills.forEach(function (pill) {
    pill.addEventListener('click', function () {
      pills.forEach(function (p) { p.classList.remove('active'); });
      pill.classList.add('active');
      filterCards(pill.dataset.filter);
    });
  });

  // ── Staggered Entrance Animation ──
  function animateEntrance() {
    cards.forEach(function (card, i) {
      setTimeout(function () {
        card.classList.add('visible');
      }, 80 * i);
    });
  }

  // Run entrance on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', animateEntrance);
  } else {
    animateEntrance();
  }
})();
</script>
