<script>
// ── Rounded Rect helper ──
function roundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Parser (from CVM) ──
function parseCVM(code) {
  let canvasW = 595, canvasH = 842, canvasBg = '#ffffff';
  const elements = [];
  const lines = code.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const trimmed = lines[i].trim();
    if (!trimmed || trimmed.startsWith('--') || trimmed.startsWith('//')) continue;
    const tokens = [];
    let j = 0;
    while (j < trimmed.length) {
      if (trimmed[j] === ' ' || trimmed[j] === '\t') { j++; continue; }
      if (trimmed[j] === '"') {
        const end = trimmed.indexOf('"', j + 1);
        if (end === -1) { tokens.push(trimmed.slice(j + 1)); j = trimmed.length; }
        else { tokens.push(trimmed.slice(j + 1, end)); j = end + 1; }
      } else {
        const end = trimmed.indexOf(' ', j);
        if (end === -1) { tokens.push(trimmed.slice(j)); j = trimmed.length; }
        else { tokens.push(trimmed.slice(j, end)); j = end + 1; }
      }
    }
    if (tokens.length === 0) continue;
    const cmd = tokens[0].toUpperCase();
    if (cmd === 'CANVAS') {
      canvasW = Number(tokens[1]) || 595;
      canvasH = Number(tokens[2]) || 842;
      canvasBg = tokens[3] || '#ffffff';
    } else if (cmd === 'RECT') {
      elements.push({ type:'rect', x:+tokens[1]||0, y:+tokens[2]||0, w:+tokens[3]||100, h:+tokens[4]||50, z:+tokens[5]||0, color:tokens[6]||'#888', radius:+tokens[7]||0 });
    } else if (cmd === 'TEXT') {
      elements.push({ type:'text', x:+tokens[1]||0, y:+tokens[2]||0, content:tokens[3]||'', size:+tokens[4]||16, z:+tokens[5]||0, color:tokens[6]||'#000', weight:(tokens[7]||'normal').toLowerCase() });
    } else if (cmd === 'IMG') {
      elements.push({ type:'img', x:+tokens[1]||0, y:+tokens[2]||0, w:+tokens[3]||200, h:+tokens[4]||150, z:+tokens[5]||0, label:tokens[6]||'image' });
    } else if (cmd === 'LINE') {
      elements.push({ type:'line', x1:+tokens[1]||0, y1:+tokens[2]||0, x2:+tokens[3]||100, y2:+tokens[4]||0, z:+tokens[5]||0, color:tokens[6]||'#000', width:+tokens[7]||1 });
    } else if (cmd === 'DIVIDER') {
      elements.push({ type:'divider', x1:+tokens[1]||0, y1:+tokens[2]||0, x2:+tokens[3]||200, y2:+tokens[4]||0, z:+tokens[5]||0, color:tokens[6]||'#d0d0d0', style:(tokens[7]||'solid').toLowerCase() });
    } else if (cmd === 'ELLIPSE') {
      elements.push({ type:'ellipse', cx:+tokens[1]||0, cy:+tokens[2]||0, rx:+tokens[3]||50, ry:+tokens[4]||50, z:+tokens[5]||0, color:tokens[6]||'#888' });
    }
  }
  elements.sort((a, b) => a.z - b.z);
  return { canvasW, canvasH, canvasBg, elements };
}

// ── Renderer ──
function drawElement(ctx, el) {
  ctx.save();
  switch (el.type) {
    case 'rect':
      ctx.fillStyle = el.color;
      if (el.radius > 0) { roundedRect(ctx, el.x, el.y, el.w, el.h, el.radius); ctx.fill(); }
      else ctx.fillRect(el.x, el.y, el.w, el.h);
      break;
    case 'text': {
      const style = el.weight === 'italic' ? 'italic ' : '';
      const weight = el.weight === 'bold' ? 'bold ' : el.weight === 'light' ? '300 ' : '';
      ctx.font = `${style}${weight}${el.size}px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif`;
      ctx.fillStyle = el.color;
      ctx.textBaseline = 'top';
      ctx.fillText(el.content, el.x, el.y);
      break;
    }
    case 'img':
      ctx.fillStyle = '#ddd'; ctx.fillRect(el.x, el.y, el.w, el.h);
      ctx.strokeStyle = '#bbb'; ctx.strokeRect(el.x, el.y, el.w, el.h);
      ctx.fillStyle = '#999'; ctx.font = '11px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(el.label, el.x + el.w/2, el.y + el.h/2);
      ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      break;
    case 'line':
      ctx.strokeStyle = el.color; ctx.lineWidth = el.width;
      ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
      break;
    case 'divider':
      ctx.strokeStyle = el.color; ctx.lineWidth = 1;
      if (el.style === 'dashed') ctx.setLineDash([6, 4]);
      else if (el.style === 'dotted') ctx.setLineDash([2, 3]);
      ctx.beginPath(); ctx.moveTo(el.x1, el.y1); ctx.lineTo(el.x2, el.y2); ctx.stroke();
      ctx.setLineDash([]);
      break;
    case 'ellipse':
      ctx.fillStyle = el.color;
      ctx.beginPath(); ctx.ellipse(el.cx, el.cy, el.rx, el.ry, 0, 0, Math.PI * 2); ctx.fill();
      break;
  }
  ctx.restore();
}
