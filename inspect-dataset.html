// Init Three.js
function initRenderer() {
  const container = document.getElementById('viewer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f1117);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(40, 30, 40);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.insertBefore(renderer.domElement, container.firstChild);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(12, 12, 12);
  controls.update();

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(30, 50, 30);
  scene.add(dir);
  scene.add(new THREE.HemisphereLight(0x8888ff, 0x444422, 0.4));

  // Grid
  const grid = new THREE.GridHelper(48, 48, 0x333333, 0x222222);
  grid.position.set(12, 0, 12);
  scene.add(grid);

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// Parse V4 code
const COLORS = [
  0x111111, 0xff3333, 0x33cc33, 0x3366ff,
  0x00cccc, 0xcc33cc, 0xffcc00, 0xff8800,
  0xeeeeee, 0x888888
];

function parseV4(code) {
  const shapes = [];
  let gridSize = [24, 24, 24];

  for (const line of code.split('\n')) {
    const trimmed = line.trim();
    if (!trimmed || trimmed.startsWith('--')) continue;
    const parts = trimmed.split(/\s+/);
    const cmd = parts[0];
    const nums = parts.slice(1).map(Number);

    if (cmd === 'V') {
      gridSize = [nums[0], nums[1], nums[2]];
    } else if (cmd === 'B') {
      shapes.push({ type: 'box', x: nums[0], y: nums[1], z: nums[2], w: nums[3], h: nums[4], d: nums[5], c: nums[6] || 9 });
    } else if (cmd === 'S') {
      shapes.push({ type: 'sphere', x: nums[0], y: nums[1], z: nums[2], r: nums[3], c: nums[4] || 9 });
    } else if (cmd === 'C') {
      shapes.push({ type: 'cylinder', x: nums[0], y: nums[1], z: nums[2], r: nums[3], h: nums[4], c: nums[5] || 9 });
    }
  }
  return { shapes, gridSize };
}

function renderModel(code) {
  // Clear old meshes
  const toRemove = [];
  scene.traverse(obj => { if (obj.userData.isModel) toRemove.push(obj); });
  toRemove.forEach(obj => { scene.remove(obj); obj.geometry?.dispose(); obj.material?.dispose(); });

  const { shapes, gridSize } = parseV4(code);

  for (const s of shapes) {
    let geo, mesh;
    const mat = new THREE.MeshLambertMaterial({ color: COLORS[s.c] || 0x888888 });

    if (s.type === 'box') {
      geo = new THREE.BoxGeometry(s.w, s.h, s.d);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(s.x + s.w/2, s.y + s.h/2, s.z + s.d/2);
    } else if (s.type === 'sphere') {
      geo = new THREE.SphereGeometry(s.r, 16, 16);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(s.x, s.y, s.z);
    } else if (s.type === 'cylinder') {
      geo = new THREE.CylinderGeometry(s.r, s.r, s.h, 16);
      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(s.x, s.y + s.h/2, s.z);
    }

    if (mesh) {
      mesh.userData.isModel = true;
      scene.add(mesh);
    }
  }

  // Center camera on model
  const cx = gridSize[0] / 2, cy = gridSize[1] / 2, cz = gridSize[2] / 2;
  controls.target.set(cx, cy, cz);
  const dist = Math.max(...gridSize) * 1.8;
  camera.position.set(cx + dist, cy + dist * 0.7, cz + dist);
  controls.update();

  return shapes.length;
}

// Load from folder
document.getElementById('folder-input').addEventListener('change', async (e) => {
  models = [];
  const files = Array.from(e.target.files).filter(f => f.name.endsWith('.v4'));
  files.sort((a, b) => a.name.localeCompare(b.name));

  for (const file of files) {
    const code = await file.text();
    const lines = code.split('\n').filter(l => l.trim() && !l.startsWith('--')).length;
    const uid = file.name.replace('.v4', '');
    const info = uidNames[uid];
    models.push({
      uid,
      name: info ? info.name : uid.slice(0, 16) + '...',
      categories: info ? info.cats : [],
      code,
      lines,
    });
  }

  document.getElementById('stats').textContent = `${models.length} models loaded`;
  renderSidebar();
  if (models.length > 0) showModel(0);
});

    <div class="item ${i === currentIdx ? 'active' : ''} ${quality[m.uid] || ''}" onclick="showModel(${i})" id="item-${i}">
      <div class="name">${m.name}</div>
      <div class="meta">${m.categories ? m.categories.join(', ') : ''} · ${m.lines} lines ${quality[m.uid] === 'bad' ? '<span class="bad">✗</span>' : quality[m.uid] === 'good' ? '<span class="good">✓</span>' : ''}</div>
    </div>
  `).join('');
}

function showModel(idx) {
  currentIdx = idx;
  const m = models[idx];
  const shapeCount = renderModel(m.code);

  document.getElementById('counter').textContent = `${idx + 1}/${models.length}`;
  document.getElementById('info').innerHTML = `
    <div><b>${m.name}</b></div>
    <div style="color:#888">${m.categories ? m.categories.join(', ') : m.uid}</div>
    <div>${m.lines} lines · ${shapeCount} shapes</div>
  `;
  document.getElementById('code-text').textContent = m.code;

  renderSidebar();
  document.getElementById(`item-${idx}`)?.scrollIntoView({ block: 'nearest' });
  updateQualityStats();
}

function nextModel() { if (currentIdx < models.length - 1) showModel(currentIdx + 1); }
function prevModel() { if (currentIdx > 0) showModel(currentIdx - 1); }

function markBad() {
  quality[models[currentIdx].uid] = quality[models[currentIdx].uid] === 'bad' ? null : 'bad';
  renderSidebar();
  updateQualityStats();
}

function markGood() {
  quality[models[currentIdx].uid] = quality[models[currentIdx].uid] === 'good' ? null : 'good';
  renderSidebar();
  updateQualityStats();
}

function updateQualityStats() {
  const good = Object.values(quality).filter(v => v === 'good').length;
  const bad = Object.values(quality).filter(v => v === 'bad').length;
  document.getElementById('quality-stats').textContent = `Good: ${good} · Bad: ${bad} · Unreviewed: ${models.length - good - bad}`;
}

function toggleCode() {
  const panel = document.getElementById('code-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'n') nextModel();
  if (e.key === 'ArrowLeft' || e.key === 'p') prevModel();
  if (e.key === 'g') markGood();
  if (e.key === 'b') markBad();
  if (e.key === 'c') toggleCode();
});

initRenderer();
</script>
</body>
</html>
