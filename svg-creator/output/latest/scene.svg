    <line x1="0" y1="24" x2="-48" y2="24" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,5"/>
    <line x1="0" y1="48" x2="-30" y2="48" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,5"/>
  </g>
</svg>