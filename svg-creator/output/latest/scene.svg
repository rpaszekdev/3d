<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
<style>
  svg { background: #ffffff; }
  * { vector-effect: non-scaling-stroke; }
@keyframes anim-torso-0 {
  from { transform: translateY(-2px); }
  to { transform: translateY(2px); }
}

#torso {
  animation: anim-torso-0 0.32s ease-in-out 0s infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes anim-head-1 {
  from { transform: translateY(-2px); }
  to { transform: translateY(2px); }
}

#head {
  animation: anim-head-1 0.32s ease-in-out 0s infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes anim-shadow-2 {
  from { transform: scale(0.88); }
  to { transform: scale(1.12); }
}

#shadow {
  animation: anim-shadow-2 0.32s ease-in-out 0s infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes entrance-head-3 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#head {
  opacity: 0;
  animation: entrance-head-3 0.5s ease-out 0s 1 forwards;
}

@keyframes entrance-neck-4 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#neck {
  opacity: 0;
  animation: entrance-neck-4 0.5s ease-out 0.05s 1 forwards;
}

@keyframes entrance-torso-5 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#torso {
  opacity: 0;
  animation: entrance-torso-5 0.5s ease-out 0.1s 1 forwards;
}

@keyframes entrance-arm-forward-6 {
  from { transform: translateX(60px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

#arm-forward {
  opacity: 0;
  animation: entrance-arm-forward-6 0.45s ease-out 0.15s 1 forwards;
}

@keyframes entrance-arm-back-7 {
  from { transform: translateX(60px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

#arm-back {
  opacity: 0;
  animation: entrance-arm-back-7 0.45s ease-out 0.2s 1 forwards;
}

@keyframes entrance-leg-forward-8 {
  from { transform: translateX(60px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

#leg-forward {
  opacity: 0;
  animation: entrance-leg-forward-8 0.45s ease-out 0.25s 1 forwards;
}

@keyframes entrance-leg-back-9 {
  from { transform: translateX(60px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

#leg-back {
  opacity: 0;
  animation: entrance-leg-back-9 0.45s ease-out 0.3s 1 forwards;
}

@keyframes entrance-motion-lines-10 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#motion-lines {
  opacity: 0;
  animation: entrance-motion-lines-10 0.7s ease-out 0.45s 1 forwards;
}

@keyframes entrance-shadow-11 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#shadow {
  opacity: 0;
  animation: entrance-shadow-11 0.4s ease-out 0.35s 1 forwards;
}
</style>
  <g id="shadow" transform="translate(326, 342)">
