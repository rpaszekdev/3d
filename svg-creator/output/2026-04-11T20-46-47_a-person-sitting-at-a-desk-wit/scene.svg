<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
<style>
  svg { background: #f8f8f8; }
  * { vector-effect: non-scaling-stroke; }
@keyframes anim-screen-ui-0 {
  from { opacity: 0.25; }
  to { opacity: 1; }
}

#screen-ui {
  animation: anim-screen-ui-0 1.8s ease-in-out 0s infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes anim-monitor-1 {
  from { opacity: 0.88; }
  to { opacity: 1; }
}

#monitor {
  animation: anim-monitor-1 3.2s ease-in-out 0s infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes entrance-desk-2 {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

#desk {
  opacity: 0;
  animation: entrance-desk-2 0.6s ease-out 0s 1 forwards;
}

@keyframes entrance-chair-3 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#chair {
  opacity: 0;
  animation: entrance-chair-3 0.5s ease-out 0.15s 1 forwards;
}

@keyframes entrance-person-4 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#person {
  opacity: 0;
  animation: entrance-person-4 0.7s ease-out 0.35s 1 forwards;
}

@keyframes entrance-monitor-5 {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

#monitor {
  opacity: 0;
  animation: entrance-monitor-5 0.55s ease-out 0.25s 1 forwards;
}

@keyframes entrance-keyboard-6 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#keyboard {
  opacity: 0;
  animation: entrance-keyboard-6 0.4s ease-out 0.55s 1 forwards;
}

@keyframes entrance-screen-ui-7 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#screen-ui {
  opacity: 0;
  animation: entrance-screen-ui-7 0.5s ease-out 0.8s 1 forwards;
}
</style>
