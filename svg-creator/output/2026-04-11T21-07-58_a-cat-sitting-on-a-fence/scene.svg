<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<style>
  svg { background: #ffffff; }
  * { vector-effect: non-scaling-stroke; }
@keyframes anim-cat-tail-0 {
  from { transform: rotate(-12deg); }
  to { transform: rotate(12deg); }
}

#cat-tail {
  animation: anim-cat-tail-0 2s ease-in-out 0s infinite alternate;
  transform-box: fill-box;
  transform-origin: center;
}

@keyframes entrance-fence-1 {
  from { opacity: 0; }
  to { opacity: 1; }
}

#fence {
  opacity: 0;
  animation: entrance-fence-1 0.5s ease-out 0s 1 forwards;
}

@keyframes entrance-cat-2 {
  from { transform: translateY(-40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

#cat {
  opacity: 0;
  animation: entrance-cat-2 0.6s ease-out 0.3s 1 forwards;
}

@keyframes entrance-cat-tail-3 {
  from { transform: translateY(-40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

#cat-tail {
  opacity: 0;
  animation: entrance-cat-tail-3 0.6s ease-out 0.3s 1 forwards;
}
</style>
