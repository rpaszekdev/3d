<html lang="en">
<head>
<meta charset="UTF-8">
<title>CVM Variations Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #111; color: #eee; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .top { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #1a1a1a; border-bottom: 1px solid #333; }
  .top h1 { font-size: 15px; font-weight: 600; }
  .top h1 span { color: #60a5fa; }
  .nav { display: flex; align-items: center; gap: 16px; }
  .nav button { background: #222; border: 1px solid #444; color: #ccc; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .nav button:hover { border-color: #60a5fa; color: #fff; }
  .nav .counter { font-size: 14px; color: #888; min-width: 40px; text-align: center; }

  .main { flex: 1; display: flex; align-items: center; justify-content: center; background: #0a0a0a; position: relative; overflow: hidden; }
  .main canvas { box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  .label { position: absolute; top: 16px; left: 24px; font-size: 13px; color: #666; }
  .label b { color: #aaa; }

  .actions { height: 64px; display: flex; align-items: center; justify-content: center; gap: 20px; background: #1a1a1a; border-top: 1px solid #333; }
  .btn-reject { background: #2a1a1a; border: 1px solid #662222; color: #f87171; padding: 10px 32px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-reject:hover { background: #3a1a1a; border-color: #aa3333; }
  .btn-save { background: #1a2a1a; border: 1px solid #226622; color: #4ade80; padding: 10px 32px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn-save:hover { background: #1a3a1a; border-color: #33aa33; }
  .btn-copy { background: #1a2233; border: 1px solid #224466; color: #60a5fa; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn-copy:hover { background: #1a3344; }

  .dots { height: 48px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #111; border-top: 1px solid #222; }
  .dot { width: 80px; padding: 6px 0; text-align: center; font-size: 11px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .dot.unseen { background: #222; color: #666; border-color: #333; }
  .dot.viewing { background: #1a2a3a; color: #60a5fa; border-color: #60a5fa; }
  .dot.saved { background: #1a2a1a; color: #4ade80; border-color: #226622; }
  .dot.rejected { background: #1a1111; color: #555; border-color: #331111; text-decoration: line-through; }
  .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: #4ade80; color: #000; padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* ── Code Editor Panel ──────────────────────── */
  .main { transition: all 0.2s; }
  .main.with-editor { }
  .main-split { display: flex; flex: 1; overflow: hidden; }
  .editor-panel { width: 0; overflow: hidden; background: #1a1d27; border-right: 1px solid #333; display: flex; flex-direction: column; transition: width 0.2s; }
  .editor-panel.open { width: 420px; }
  .editor-panel-head { height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #15171f; border-bottom: 1px solid #333; flex-shrink: 0; }
  .editor-panel-head span { font-size: 11px; color: #888; }
  .editor-panel-head button { background: none; border: none; color: #60a5fa; cursor: pointer; font-size: 11px; }
  .editor-panel textarea { flex: 1; background: #1a1d27; color: #e0e0e8; border: none; resize: none; font-size: 11px; font-family: 'SF Mono','Fira Code','Consolas',monospace; line-height: 1.6; padding: 8px; outline: none; tab-size: 2; white-space: pre; overflow: auto; }
  .editor-panel .editor-status { height: 24px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; color: #4caf50; border-top: 1px solid #333; background: #15171f; flex-shrink: 0; }
  .btn-code { background: #1a2233 !important; border-color: #224466 !important; color: #60a5fa !important; }

  /* ── Gallery Mode ───────────────────────────── */
  .gallery-view { display: none; flex-direction: column; height: 100vh; background: #111; }
  .gallery-view.active { display: flex; }
  .review-view { display: flex; flex-direction: column; height: 100vh; }
  .review-view.hidden { display: none; }

  .gallery-top { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: #1a1a1a; border-bottom: 1px solid #333; flex-shrink: 0; }
  .gallery-top h1 { font-size: 15px; font-weight: 600; }
  .gallery-top h1 span { color: #60a5fa; }
  .gallery-top .stats { font-size: 12px; color: #666; }
  .gallery-top .btn-new { background: #60a5fa; border: none; color: #fff; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .gallery-top .btn-new:hover { background: #3b82f6; }
  .gallery-top .btn-back { background: #222; border: 1px solid #444; color: #ccc; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .gallery-top .btn-back:hover { border-color: #60a5fa; }

  .gallery-tabs { display: flex; gap: 0; padding: 0 24px; background: #1a1a1a; border-bottom: 1px solid #333; flex-shrink: 0; }
  .gallery-tab { padding: 10px 20px; font-size: 12px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; }
  .gallery-tab:hover { color: #aaa; }
  .gallery-tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }
  .gallery-tab .count { background: #333; padding: 1px 6px; border-radius: 8px; font-size: 10px; margin-left: 6px; }
  .gallery-tab.active .count { background: #1a2a3a; color: #60a5fa; }

  .gallery-grid { flex: 1; overflow-y: auto; padding: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; align-content: start; }

  .gallery-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
  .gallery-card:hover { border-color: #60a5fa; transform: translateY(-2px); }
  .gallery-card.saved { border-color: #226622; }
  .gallery-card.rejected { opacity: 0.4; }
  .gallery-card canvas { width: 100%; height: 200px; object-fit: contain; display: block; background: #0a0a0a; }
  .gallery-card-info { padding: 12px 16px; }
  .gallery-card-info h3 { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .gallery-card-info p { font-size: 11px; color: #666; }
  .gallery-card-info .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-top: 6px; }
  .gallery-card-info .badge.saved { background: #1a2a1a; color: #4ade80; }
  .gallery-card-info .badge.rejected { background: #2a1a1a; color: #f87171; }
  .gallery-card-info .badge.unseen { background: #222; color: #666; }
  .gallery-card-actions { display: flex; gap: 8px; padding: 0 16px 12px; }
  .gallery-card-actions button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #333; background: #222; color: #aaa; font-size: 11px; cursor: pointer; }
  .gallery-card-actions button:hover { border-color: #60a5fa; color: #fff; }
  .gallery-card-actions .btn-s { border-color: #226622; color: #4ade80; }
  .gallery-card-actions .btn-r { border-color: #662222; color: #f87171; }
  .gallery-card-actions .btn-c { border-color: #224466; color: #60a5fa; }

  .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 0; color: #444; }
  .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: #555; }

<script>
// ── Helpers ──────────────────────────────────────

function roundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r || 0, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ── Mini Parser (CANVAS, RECT, TEXT, LINE, ELLIPSE only — fast) ──

function parse(code) {
  let W = 1440, H = 900, bg = '#1a1a1a';
  const els = [];
  for (const raw of code.split('\n')) {
    const t = raw.trim();
    if (!t || t.startsWith('--')) continue;
    const tk = [];
    let j = 0;
    while (j < t.length) {
      if (t[j] === ' ' || t[j] === '\t') { j++; continue; }
      if (t[j] === '"') {
        const e = t.indexOf('"', j + 1);
        if (e === -1) { tk.push(t.slice(j+1)); j = t.length; }
        else { tk.push(t.slice(j+1, e)); j = e+1; }
      } else {
        const e = t.indexOf(' ', j);
        if (e === -1) { tk.push(t.slice(j)); j = t.length; }
        else { tk.push(t.slice(j, e)); j = e+1; }
      }
    }
    if (!tk.length) continue;
    const c = tk[0].toUpperCase();
    if (c === 'CANVAS') { W = +tk[1]||1440; H = +tk[2]||900; bg = tk[3]||'#1a1a1a'; }
    else if (c === 'RECT') els.push({t:'r',x:+tk[1],y:+tk[2],w:+tk[3],h:+tk[4],z:+tk[5]||0,c:tk[6]||'#888',rd:+tk[7]||0});
    else if (c === 'TEXT') els.push({t:'t',x:+tk[1],y:+tk[2],s:tk[3]||'',sz:+tk[4]||14,z:+tk[5]||0,c:tk[6]||'#fff',wt:(tk[7]||'').toLowerCase()});
    else if (c === 'LINE') els.push({t:'l',x1:+tk[1],y1:+tk[2],x2:+tk[3],y2:+tk[4],z:+tk[5]||0,c:tk[6]||'#fff',w:+tk[7]||1});
    else if (c === 'ELLIPSE') els.push({t:'e',cx:+tk[1],cy:+tk[2],rx:+tk[3],ry:+tk[4],z:+tk[5]||0,c:tk[6]||'#888'});
  }
  els.sort((a,b) => a.z - b.z);
  return { W, H, bg, els };
}

function draw(canvas, code) {
  const { W, H, bg, els } = parse(code);
  // Fit to viewport
  const area = document.getElementById('main-area');
  const maxW = area.clientWidth - 60, maxH = area.clientHeight - 40;
  const scale = Math.min(maxW / W, maxH / H, 1);
  canvas.width = W; canvas.height = H;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (const e of els) {
    ctx.save();
    if (e.t === 'r') {
      ctx.fillStyle = e.c;
      if (e.rd > 0) { roundedRect(ctx, e.x, e.y, e.w, e.h, e.rd); ctx.fill(); }
      else ctx.fillRect(e.x, e.y, e.w, e.h);
    } else if (e.t === 't') {
      const st = e.wt === 'italic' ? 'italic ' : '';
      const wt = e.wt === 'bold' ? 'bold ' : e.wt === 'light' ? '300 ' : '';
      ctx.font = `${st}${wt}${e.sz}px -apple-system,system-ui,sans-serif`;
      ctx.fillStyle = e.c; ctx.textBaseline = 'top';
      ctx.fillText(e.s, e.x, e.y);
    } else if (e.t === 'l') {
      ctx.strokeStyle = e.c; ctx.lineWidth = e.w;
      ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
    } else if (e.t === 'e') {
      ctx.fillStyle = e.c; ctx.beginPath();
      ctx.ellipse(e.cx, e.cy, e.rx, e.ry, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── State ───────────────────────────────────────

let current = 0;
const states = VARIATIONS.map(() => 'unseen'); // unseen | saved | rejected

const cvCanvas = document.getElementById('cv');
const counterEl = document.getElementById('counter');
const labelEl = document.getElementById('label');
const dotsEl = document.getElementById('dots');

function show(idx) {
  current = idx;
  if (states[idx] === 'unseen') states[idx] = 'unseen'; // keep
  const v = VARIATIONS[idx];
  draw(cvCanvas, v.code);
  counterEl.textContent = `${idx + 1}/${VARIATIONS.length}`;
  labelEl.innerHTML = `<b>${v.name}</b> — ${v.desc}`;
  updateDots();
}

function updateDots() {
  dotsEl.innerHTML = VARIATIONS.map((v, i) => {
    let cls = states[i];
    if (i === current && cls !== 'saved' && cls !== 'rejected') cls = 'viewing';
    return `<div class="dot ${cls}" data-i="${i}">${v.name.split('—')[0].trim()}</div>`;
  }).join('');
  dotsEl.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => show(Number(d.dataset.i)));
  });
}

function next() { show((current + 1) % VARIATIONS.length); }
function prev() { show((current - 1 + VARIATIONS.length) % VARIATIONS.length); }

// ── Buttons ─────────────────────────────────────

document.getElementById('btn-next').addEventListener('click', next);
document.getElementById('btn-prev').addEventListener('click', prev);

document.getElementById('btn-save').addEventListener('click', () => {
  states[current] = 'saved';
  updateDots();
  // Auto-advance
  const nextUnseen = states.findIndex((s, i) => i > current && s === 'unseen');
  if (nextUnseen !== -1) show(nextUnseen);
});

document.getElementById('btn-reject').addEventListener('click', () => {
  states[current] = 'rejected';
  updateDots();
  const nextUnseen = states.findIndex((s, i) => i > current && s === 'unseen');
  if (nextUnseen !== -1) show(nextUnseen);
});

document.getElementById('btn-clipboard').addEventListener('click', () => {
  navigator.clipboard.writeText(VARIATIONS[current].code);
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
});

// Arrow keys
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === 's' || e.key === 'Enter') { document.getElementById('btn-save').click(); }
  else if (e.key === 'r' || e.key === 'Backspace') { document.getElementById('btn-reject').click(); }
});

// ── Gallery Mode ────────────────────────────────

let allSketches = [];
let batchCounter = 1;
let galleryFilter = 'all';

function loadFromStorage() {
  try {
    const data = JSON.parse(localStorage.getItem('cvm-gallery') || '[]');
    if (data.length) { allSketches = data; batchCounter = Math.max(...data.map(s => parseInt(s.batch.replace('Batch ',''))||1)) + 1; }
  } catch(e) {}
}

function saveToStorage() {
  try { localStorage.setItem('cvm-gallery', JSON.stringify(allSketches)); } catch(e) {}
}

function syncStatesToGallery() {
  const last = `Batch ${batchCounter - 1}`;
  const batch = allSketches.filter(s => s.batch === last);
  VARIATIONS.forEach((v, i) => {
    const m = batch.find(s => s.name === v.name);
    if (m) m.state = states[i];
  });
  saveToStorage();
}

function initBatch() {
  const batchName = `Batch ${batchCounter}`;
  VARIATIONS.forEach((v, i) => {
    allSketches.push({ name: v.name, desc: v.desc, code: v.code, state: states[i] || 'unseen', batch: batchName, id: Date.now() + i });
  });
  batchCounter++;
  saveToStorage();
}

function showGallery() {
  syncStatesToGallery();
  document.getElementById('review-view').classList.add('hidden');
  document.getElementById('gallery-view').classList.add('active');
  renderGallery();
}

function hideGallery() {
  document.getElementById('gallery-view').classList.remove('active');
  document.getElementById('review-view').classList.remove('hidden');
  show(current);
}

function renderGallery() {
  const filtered = galleryFilter === 'all' ? allSketches : allSketches.filter(s => s.state === galleryFilter);
  const grid = document.getElementById('gallery-grid');

  document.getElementById('count-all').textContent = allSketches.length;
  document.getElementById('count-saved').textContent = allSketches.filter(s => s.state === 'saved').length;
  document.getElementById('count-rejected').textContent = allSketches.filter(s => s.state === 'rejected').length;
  document.getElementById('count-unseen').textContent = allSketches.filter(s => s.state === 'unseen').length;
  document.getElementById('gallery-stats').textContent = `${allSketches.length} sketches · ${allSketches.filter(s=>s.state==='saved').length} saved`;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><h2>No sketches here</h2><p>Try a different filter or create a new batch</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(s => {
    const gi = allSketches.indexOf(s);
    return `<div class="gallery-card ${s.state}" data-idx="${gi}">
      <canvas id="gc-${gi}" width="1440" height="900"></canvas>
      <div class="gallery-card-info">
        <h3>${s.name}</h3>
        <p>${s.desc}</p>
        <span class="badge ${s.state}">${s.state}</span>
        <span style="float:right;font-size:10px;color:#444">${s.batch}</span>
      </div>
      <div class="gallery-card-actions">
        <button class="btn-s" data-action="save" data-idx="${gi}">✓ Save</button>
        <button class="btn-r" data-action="reject" data-idx="${gi}">✗ Reject</button>
        <button class="btn-c" data-action="copy" data-idx="${gi}">Copy</button>
      </div>
    </div>`;
  }).join('');

  // Render thumbnails
  filtered.forEach(s => {
    const gi = allSketches.indexOf(s);
    const c = document.getElementById(`gc-${gi}`);
    if (!c) return;
    const { W, H, bg, els } = parse(s.code);
    c.width = W; c.height = H;
    const cx = c.getContext('2d');
    cx.fillStyle = bg; cx.fillRect(0, 0, W, H);
    for (const e of els) {
      cx.save();
      if (e.t==='r') { cx.fillStyle=e.c; if(e.rd>0){roundedRect(cx,e.x,e.y,e.w,e.h,e.rd);cx.fill();}else cx.fillRect(e.x,e.y,e.w,e.h); }
      else if (e.t==='t') { cx.font=`${e.wt==='italic'?'italic ':''}${e.wt==='bold'?'bold ':e.wt==='light'?'300 ':''}${e.sz}px -apple-system,system-ui,sans-serif`; cx.fillStyle=e.c; cx.textBaseline='top'; cx.fillText(e.s,e.x,e.y); }
      else if (e.t==='l') { cx.strokeStyle=e.c; cx.lineWidth=e.w; cx.beginPath(); cx.moveTo(e.x1,e.y1); cx.lineTo(e.x2,e.y2); cx.stroke(); }
      else if (e.t==='e') { cx.fillStyle=e.c; cx.beginPath(); cx.ellipse(e.cx,e.cy,e.rx,e.ry,0,0,Math.PI*2); cx.fill(); }
      cx.restore();
    }
  });

  // Wire action buttons
  grid.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = +btn.dataset.idx, action = btn.dataset.action;
      if (action === 'save') { allSketches[idx].state = 'saved'; }
      else if (action === 'reject') { allSketches[idx].state = 'rejected'; }
      else if (action === 'copy') {
        navigator.clipboard.writeText(allSketches[idx].code);
        const t = document.getElementById('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1500);
        return;
      }
      saveToStorage(); renderGallery();
    });
  });

  // Click card → open in review
  grid.querySelectorAll('.gallery-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') return;
      const idx = +card.dataset.idx;
      const sketch = allSketches[idx];
      const vIdx = VARIATIONS.findIndex(v => v.name === sketch.name);
      if (vIdx !== -1) { hideGallery(); show(vIdx); }
    });
  });
}

// Tab switching
document.getElementById('gallery-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.gallery-tab');
  if (!tab) return;
  document.querySelectorAll('.gallery-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  galleryFilter = tab.dataset.filter;
  renderGallery();
});

document.getElementById('btn-gallery').addEventListener('click', showGallery);
document.getElementById('btn-back-review').addEventListener('click', hideGallery);

document.getElementById('btn-new-batch').addEventListener('click', () => {
  const code = prompt('Paste new variation DSL code (or leave empty for a copy of v1):');
  const newCode = code && code.trim() ? code.trim() : VARIATIONS[0].code;
  const batchName = `Batch ${batchCounter}`;
  allSketches.push({ name: `Custom ${allSketches.length + 1}`, desc: 'User-created variation', code: newCode, state: 'unseen', batch: batchName, id: Date.now() });
  batchCounter++;
  saveToStorage();
  renderGallery();
});


// ── Init ────────────────────────────────────────

loadFromStorage();
if (allSketches.length === 0) initBatch();

show(0);
window.addEventListener('resize', () => {
  if (!document.getElementById('gallery-view').classList.contains('active')) show(current);
});

</script>
