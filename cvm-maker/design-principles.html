<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVM — 10 Design Principles</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0c10;
    --paper: #f4f1eb;
    --blue: #2563eb;
    --blue-light: #dbeafe;
    --green: #16a34a;
    --green-light: #dcfce7;
    --red: #dc2626;
    --red-light: #fef2f2;
    --amber: #d97706;
    --amber-light: #fef3c7;
    --muted: #6b7280;
    --border: #d1d5db;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--sans); background: var(--ink); color: var(--paper); overflow-x: hidden; }

  /* ── Navigation ─────────────────── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px; background: rgba(10,12,16,0.92); backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  nav .logo { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 2px; }
  nav .logo span { color: var(--blue); }
  nav .dots { display: flex; gap: 6px; }
  nav .dot {
    width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.12);
    cursor: pointer; transition: all 0.3s;
  }
  nav .dot.active { background: var(--blue); box-shadow: 0 0 12px rgba(37,99,235,0.5); transform: scale(1.3); }
  nav .dot:hover { background: rgba(255,255,255,0.3); }
  nav .counter { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ── Sections ───────────────────── */
  .principle {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 80px 40px; position: relative; overflow: hidden;
  }
  .principle::before {
    content: attr(data-num);
    position: absolute; top: -40px; right: -20px;
    font-family: var(--serif); font-size: 300px; font-weight: 400;
    color: rgba(255,255,255,0.02); pointer-events: none; line-height: 1;
  }

  .principle-inner {
    max-width: 1320px; width: 100%; display: grid;
    grid-template-columns: 400px 1fr; gap: 60px; align-items: center;
  }

  /* ── Text Column ────────────────── */
  .principle-text { position: relative; }
  .principle-num {
    font-family: var(--mono); font-size: 11px; letter-spacing: 3px;
    color: var(--blue); margin-bottom: 12px; text-transform: uppercase;
  }
  .principle-title {
    font-family: var(--serif); font-size: 42px; line-height: 1.15;
    margin-bottom: 20px; color: var(--paper);
  }
  .principle-desc {
    font-size: 15px; line-height: 1.7; color: rgba(244,241,235,0.55);
    max-width: 360px;
  }
  .principle-quote {
    margin-top: 24px; padding: 16px 20px; border-left: 2px solid var(--blue);
    font-family: var(--serif); font-style: italic; font-size: 14px;
    color: rgba(244,241,235,0.4); background: rgba(37,99,235,0.04);
  }

  /* ── Sketch Column ──────────────── */
  .sketch-frame {
    background: #1a1d24; border-radius: 16px; overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative;
  }
  .sketch-chrome {
    height: 36px; background: #12141a; display: flex; align-items: center;
    padding: 0 14px; gap: 7px;
  }
  .sketch-chrome i { width: 10px; height: 10px; border-radius: 50%; }
  .sketch-chrome i:nth-child(1) { background: #ff5f57; }
  .sketch-chrome i:nth-child(2) { background: #febc2e; }
  .sketch-chrome i:nth-child(3) { background: #28c840; }
  .sketch-chrome span { margin-left: auto; font-family: var(--mono); font-size: 10px; color: #555; }
  .sketch-body { position: relative; }
  .sketch-body canvas { display: block; width: 100%; height: auto; }

  /* ── Scroll indicator ───────────── */
  .scroll-hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.2);
    letter-spacing: 2px; animation: pulse 2s ease infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.2; } 50% { opacity: 0.5; } }

  /* ── Alternating backgrounds ────── */
  .principle:nth-child(even) { background: #0d0f14; }
  .principle:nth-child(odd) { background: #0a0c10; }
  .principle:nth-child(even)::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(37,99,235,0.03), transparent 60%);
    pointer-events: none;
  }

  /* ── Animations ─────────────────── */
  .principle-inner { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.16,1,0.3,1); }
  .principle.visible .principle-inner { opacity: 1; transform: translateY(0); }
  .sketch-frame { opacity: 0; transform: translateY(30px) scale(0.97); transition: all 0.9s cubic-bezier(0.16,1,0.3,1) 0.2s; }
  .principle.visible .sketch-frame { opacity: 1; transform: translateY(0) scale(1); }
</style>
</head>

  { num: '01', title: 'The 10-Second\nRule', desc: 'The user sees a rendered CV within 10 seconds. No spinner. The canvas draws itself live — rectangles appearing, text filling in. Collapsed perceived time even if actual generation takes longer.', quote: 'Hormozi: minimize time delay. The faster the result, the higher the perceived value.' },
  { num: '02', title: 'Two Inputs,\nOne Button', desc: 'Your info textarea. Job posting textarea. Generate button. That is the entire product. Every additional field kills conversion. AI picks template, colors, fonts, pages.', quote: 'Rob Walling: at each funnel step you lose the majority. So have fewer steps.' },
  { num: '03', title: 'Never Show\nan Empty State', desc: 'When someone lands, the canvas shows a pre-generated beautiful example CV. Rotating examples. When they hit Generate, their CV replaces the example. Instant gratification.', quote: 'Perceived likelihood goes up — they can see the end result before starting.' },
  { num: '04', title: 'Variations Are\nthe Product', desc: 'Generate 4 variations every time. Different layouts, emphasis, visual styles. Choice = ownership. Eliminates "is this good enough?" The variations screen IS the product.', quote: 'Picking from options feels like agency, not passivity.' },
  { num: '05', title: 'Chat Fixes,\nNot Edit Mode', desc: '"Add my Python cert." "Make work experience longer." "Remove the photo." Natural language, not drag-and-drop. Like messaging a CV writer on Fiverr. The user never sees the DSL.', quote: 'The chat input should feel like messaging, not a command line.' },
  { num: '06', title: 'ATS Score =\nTrust Signal', desc: 'A number that says "this CV is 92% matched to this job." That number justifies $15-39. Without it, just another pretty PDF. With it, a strategic tool. Break it down by keyword category.', quote: 'Hormozi: perceived likelihood of achievement.' },
  { num: '07', title: 'Paywall After\nthe Dopamine', desc: 'Generate free. See the beautiful CV. Feel the "holy shit" moment. Then paywall the download. Don\'t blur everything — let them see enough. Sunk cost + visible result = conversion.', quote: 'Deliver actual value first, then measure willingness to pay.' },
  { num: '08', title: 'Mobile-First\nIs Non-Negotiable', desc: 'Job seekers browse on phones. Copy job URL from LinkedIn, switch to your site, paste, generate, swipe 4 variations, download. No pinch-to-zoom. Full-width cards they swipe.', quote: 'The canvas preview should be a full-width card, not a miniature A4.' },
  { num: '09', title: 'Remember\nReturning Users', desc: 'First visit: empty textareas. Second visit: info pre-filled. Only job description is empty. Generating a new tailored CV for a new job takes 5 seconds. That\'s when $29/mo feels like nothing.', quote: 'The value metric is CVs generated per job.' },

// ── Render ──────────────────────────────────────

function roundedRect(ctx, x, y, w, h, r) {
  r = Math.min(r||0, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function parse(code) {
  let W=800, H=520, bg='#1a1a1a';
  const els = [];
  for (const raw of code.split('\n')) {
    const t = raw.trim();
    if (!t || t.startsWith('--')) continue;
    const tk = [];
    let j = 0;
    while (j < t.length) {
      if (t[j]===' '||t[j]==='\t') { j++; continue; }
      if (t[j]==='"') { const e=t.indexOf('"',j+1); if(e===-1){tk.push(t.slice(j+1));j=t.length;}else{tk.push(t.slice(j+1,e));j=e+1;} }
      else { const e=t.indexOf(' ',j); if(e===-1){tk.push(t.slice(j));j=t.length;}else{tk.push(t.slice(j,e));j=e+1;} }
    }
    if (!tk.length) continue;
    const c = tk[0].toUpperCase();
    if (c==='CANVAS') { W=+tk[1]||800; H=+tk[2]||520; bg=tk[3]||'#1a1a1a'; }
    else if (c==='RECT') els.push({t:'r',x:+tk[1],y:+tk[2],w:+tk[3],h:+tk[4],z:+tk[5]||0,c:tk[6]||'#888',rd:+tk[7]||0});
    else if (c==='TEXT') els.push({t:'t',x:+tk[1],y:+tk[2],s:tk[3]||'',sz:+tk[4]||14,z:+tk[5]||0,c:tk[6]||'#fff',wt:(tk[7]||'').toLowerCase()});
    else if (c==='LINE') els.push({t:'l',x1:+tk[1],y1:+tk[2],x2:+tk[3],y2:+tk[4],z:+tk[5]||0,c:tk[6]||'#fff',w:+tk[7]||1});
    else if (c==='ELLIPSE') els.push({t:'e',cx:+tk[1],cy:+tk[2],rx:+tk[3],ry:+tk[4],z:+tk[5]||0,c:tk[6]||'#888'});
  }
  els.sort((a,b) => a.z - b.z);
  return { W, H, bg, els };
}

function draw(canvas, code) {
  const { W, H, bg, els } = parse(code);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  for (const e of els) {
    ctx.save();
    if (e.t==='r') { ctx.fillStyle=e.c; if(e.rd>0){roundedRect(ctx,e.x,e.y,e.w,e.h,e.rd);ctx.fill();}else ctx.fillRect(e.x,e.y,e.w,e.h); }
    else if (e.t==='t') { ctx.font=`${e.wt==='italic'?'italic ':''}${e.wt==='bold'?'bold ':''}${e.sz}px -apple-system,system-ui,sans-serif`; ctx.fillStyle=e.c; ctx.textBaseline='top'; ctx.fillText(e.s,e.x,e.y); }
    else if (e.t==='l') { ctx.strokeStyle=e.c; ctx.lineWidth=e.w; ctx.beginPath(); ctx.moveTo(e.x1,e.y1); ctx.lineTo(e.x2,e.y2); ctx.stroke(); }
    else if (e.t==='e') { ctx.fillStyle=e.c; ctx.beginPath(); ctx.ellipse(e.cx,e.cy,e.rx,e.ry,0,0,Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
}

// ── Build DOM ───────────────────────────────────

const container = document.getElementById('principles');
const dotsEl = document.getElementById('nav-dots');

PRINCIPLES.forEach((p, i) => {
  // Nav dot
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.onclick = () => sections[i].scrollIntoView({ behavior: 'smooth' });
  dotsEl.appendChild(dot);

  // Section
  const section = document.createElement('div');
  section.className = 'principle';
  section.dataset.num = p.num;
  section.innerHTML = `
    <div class="principle-inner">
      <div class="principle-text">
        <div class="principle-num">PRINCIPLE ${p.num}</div>
        <h2 class="principle-title">${p.title.replace('\n','<br>')}</h2>
        <p class="principle-desc">${p.desc}</p>
        <div class="principle-quote">${p.quote}</div>
      </div>
      <div class="sketch-frame">
        <div class="sketch-chrome"><i></i><i></i><i></i><span>principle-${p.num}.voxi</span></div>
        <div class="sketch-body"><canvas id="sketch-${i}"></canvas></div>
      </div>
    </div>
  `;
  container.appendChild(section);
});

const sections = document.querySelectorAll('.principle');

// Render all sketches
SKETCHES.forEach((code, i) => {
  const canvas = document.getElementById(`sketch-${i}`);
  if (canvas) draw(canvas, code);
});

// ── Scroll Observer ─────────────────────────────

const obs = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
      const idx = Array.from(sections).indexOf(entry.target);
      document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));
      document.getElementById('nav-counter').textContent = `${String(idx + 1).padStart(2, '0')} / 10`;
    }
  });
}, { threshold: 0.4 });

sections.forEach(s => obs.observe(s));
</script>
