<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKETCH — Pure Line Drawing Language</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #fafaf8; --surface: #fff; --border: #e0ddd8;
    --text: #2a2a2a; --text-dim: #999; --accent: #333;
    --canvas-bg: #ffffff; --stroke: #222;
  }
  body {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  .header {
    height: 36px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .header h1 { font-size: 13px; font-weight: 600; letter-spacing: 1px; }
  .header select, .header button {
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); padding: 3px 8px; font-size: 11px; cursor: pointer;
    font-family: inherit;
  }
  .header select:hover, .header button:hover { border-color: var(--accent); }
  .header .spacer { flex: 1; }
  .header .info { font-size: 11px; color: var(--text-dim); }
  .header label { font-size: 11px; color: var(--text-dim); }
  .mode-btn { font-size: 11px !important; }
  .mode-btn.active { background: var(--accent) !important; color: #fff !important; }

  .split { display: flex; height: calc(100vh - 36px); }

  .editor-pane {
    width: 380px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .editor-wrap { flex: 1; position: relative; overflow: hidden; }
  .line-numbers {
    position: absolute; left: 0; top: 0; bottom: 0; width: 28px;
    background: #f5f4f0; color: var(--text-dim); font-size: 11px;
    line-height: 1.6; padding: 6px 4px; text-align: right; overflow: hidden;
    user-select: none; border-right: 1px solid var(--border);
  }
  textarea {
    position: absolute; left: 28px; top: 0; right: 0; bottom: 0;
    background: transparent; color: var(--text); border: none; resize: none;
    font-size: 11px; font-family: inherit;
    line-height: 1.6; padding: 6px; outline: none; tab-size: 4;
    white-space: pre; overflow: auto;
  }
  textarea::placeholder { color: var(--text-dim); }

  .format-ref {
    padding: 4px 8px; border-top: 1px solid var(--border);
    font-size: 9px; color: var(--text-dim); line-height: 1.7;
    background: #f5f4f0;
  }
  .format-ref b { color: var(--text); }
  .status {
    height: 22px; display: flex; align-items: center; padding: 0 8px;
    font-size: 10px; color: var(--text-dim); border-top: 1px solid var(--border);
  }
  .status .spacer { flex: 1; }

  .canvas-pane {
    flex: 1; background: #f0eeea; overflow: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .canvas-wrap { position: relative; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  #main-canvas { display: block; background: #fff; }

  /* Vision matrix panel */
  .matrix-panel {
    width: 280px; border-left: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .matrix-title {
    font-size: 10px; font-weight: 600; padding: 6px 8px; color: var(--text-dim);
    border-bottom: 1px solid var(--border); background: #f5f4f0;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .matrix-content {
    flex: 1; overflow: auto; padding: 4px;
    font-size: 8px; line-height: 1.2; white-space: pre;
    color: var(--text-dim); font-family: inherit;
  }
  .matrix-controls {
    padding: 4px 8px; border-bottom: 1px solid var(--border);
    font-size: 10px; display: flex; gap: 6px; align-items: center;
    background: #f5f4f0;
  }
  .matrix-controls label { color: var(--text-dim); }
  .matrix-controls select {
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
    font-size: 10px; font-family: inherit; padding: 1px 4px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>SKETCH</h1>
  <select id="examples"><option value="">— examples —</option></select>
  <label>Zoom:</label>
  <select id="zoom">
    <option value="0.5">50%</option>
    <option value="0.75">75%</option>
    <option value="1" selected>100%</option>
    <option value="1.5">150%</option>
    <option value="2">200%</option>
  </select>
  <label>Stroke:</label>
  <select id="stroke-width">
    <option value="1">1px</option>
    <option value="1.5" selected>1.5px</option>
    <option value="2">2px</option>
    <option value="3">3px</option>
  </select>
  <div class="spacer"></div>
  <button id="btn-export">Export PNG</button>
  <button id="btn-copy-matrix">Copy Matrix</button>
  <span class="info" id="info"></span>
</div>

<div class="split">
  <div class="editor-pane">
    <div class="editor-wrap">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="editor" spellcheck="false" placeholder="SKETCH 800 600&#10;LINE 0 400 200 200&#10;RECT 300 250 100 80&#10;ELLIPSE 600 300 40 40&#10;TEXT 50 550 &quot;hello&quot;"></textarea>
    </div>
    <div class="format-ref">
      <b>SKETCH w h</b> canvas &middot;
      <b>LINE x1 y1 x2 y2</b> &middot;
      <b>RECT x y w h</b> &middot;
      <b>ELLIPSE cx cy rx ry</b><br>
      <b>ARC cx cy r start end</b> (degrees) &middot;
      <b>TEXT x y "str" [size]</b> &middot;
      <b>--</b> comment
    </div>
    <div class="status">
      <span id="status-text">Ready</span>
      <span class="spacer"></span>
      <span id="stroke-count"></span>
    </div>
  </div>

  <div class="canvas-pane">
    <div class="canvas-wrap">
      <canvas id="main-canvas"></canvas>
    </div>
  </div>

  <div class="matrix-panel">
    <div class="matrix-title">Vision Matrix</div>
    <div class="matrix-controls">
      <label>Grid:</label>
      <select id="matrix-res">
        <option value="32">32×</option>
        <option value="48" selected>48×</option>
        <option value="64">64×</option>
        <option value="80">80×</option>
      </select>
      <label>Char:</label>
      <select id="matrix-charset">
        <option value="density" selected>Density</option>
        <option value="digits">0-9</option>
        <option value="block">Block</option>
      </select>
    </div>
    <div class="matrix-content" id="matrix-content"></div>
  </div>
</div>

<script>
// ── Parser ─────────────────────────────────────────────────────────

function parseSketch(code) {
  let W = 800, H = 600;
  const strokes = [];

  const lines = code.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw || raw.startsWith('--') || raw.startsWith('//')) continue;

    // Tokenize respecting quotes
    const tokens = [];
    let j = 0;
    while (j < raw.length) {
      if (raw[j] === ' ' || raw[j] === '\t') { j++; continue; }
      if (raw[j] === '"') {
        const end = raw.indexOf('"', j + 1);
        if (end === -1) { tokens.push(raw.slice(j + 1)); j = raw.length; }
        else { tokens.push(raw.slice(j + 1, end)); j = end + 1; }
      } else {
        const end = raw.indexOf(' ', j);
        if (end === -1) { tokens.push(raw.slice(j)); j = raw.length; }
        else { tokens.push(raw.slice(j, end)); j = end + 1; }
      }
    }

    const cmd = tokens[0].toUpperCase();

    if (cmd === 'SKETCH' || cmd === 'CANVAS' || cmd === 'S') {
      W = Number(tokens[1]) || 800;
      H = Number(tokens[2]) || 600;
    } else if (cmd === 'LINE' || cmd === 'L') {
      strokes.push({ type: 'line', line: i,
        x1: Number(tokens[1])||0, y1: Number(tokens[2])||0,
        x2: Number(tokens[3])||0, y2: Number(tokens[4])||0 });
    } else if (cmd === 'RECT' || cmd === 'R') {
      strokes.push({ type: 'rect', line: i,
        x: Number(tokens[1])||0, y: Number(tokens[2])||0,
        w: Number(tokens[3])||50, h: Number(tokens[4])||50 });
    } else if (cmd === 'ELLIPSE' || cmd === 'E') {
      strokes.push({ type: 'ellipse', line: i,
        cx: Number(tokens[1])||0, cy: Number(tokens[2])||0,
        rx: Number(tokens[3])||20, ry: Number(tokens[4])||20 });
    } else if (cmd === 'ARC' || cmd === 'A') {
      strokes.push({ type: 'arc', line: i,
        cx: Number(tokens[1])||0, cy: Number(tokens[2])||0,
        r: Number(tokens[3])||20,
        start: (Number(tokens[4])||0) * Math.PI / 180,
        end: (Number(tokens[5])||360) * Math.PI / 180 });
    } else if (cmd === 'TEXT' || cmd === 'T') {
      strokes.push({ type: 'text', line: i,
        x: Number(tokens[1])||0, y: Number(tokens[2])||0,
        content: tokens[3] || '',
        size: Number(tokens[4]) || 14 });
    }
  }

  return { W, H, strokes };
}


// ── Renderer ───────────────────────────────────────────────────────

const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
let currentZoom = 1;
let currentStrokeWidth = 1.5;

function renderSketch(parsed) {
  const { W, H, strokes } = parsed;
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = (W * currentZoom) + 'px';
  canvas.style.height = (H * currentZoom) + 'px';

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = '#222';
  ctx.lineWidth = currentStrokeWidth;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.fillStyle = '#222';

  for (const s of strokes) {
    switch (s.type) {
      case 'line':
        ctx.beginPath();
        ctx.moveTo(s.x1, s.y1);
        ctx.lineTo(s.x2, s.y2);
        ctx.stroke();
        break;
      case 'rect':
        ctx.strokeRect(s.x + 0.5, s.y + 0.5, s.w, s.h);
        break;
      case 'ellipse':
        ctx.beginPath();
        ctx.ellipse(s.cx, s.cy, Math.abs(s.rx), Math.abs(s.ry), 0, 0, Math.PI * 2);
        ctx.stroke();
        break;
      case 'arc':
        ctx.beginPath();
        ctx.arc(s.cx, s.cy, s.r, s.start, s.end);
        ctx.stroke();
        break;
      case 'text':
        ctx.font = `${s.size}px 'SF Mono', 'Consolas', monospace`;
        ctx.fillText(s.content, s.x, s.y + s.size);
        break;
    }
  }
}


// ── Vision Matrix Generator ────────────────────────────────────────

function generateMatrix(parsed, gridCols) {
  const { W, H } = parsed;
  const gridRows = Math.round(gridCols * (H / W));
  const cellW = W / gridCols;
  const cellH = H / gridRows;

  // Render to offscreen canvas, then sample density
  const offCanvas = document.createElement('canvas');
  offCanvas.width = W;
  offCanvas.height = H;
  const offCtx = offCanvas.getContext('2d');

  // White background
  offCtx.fillStyle = '#fff';
  offCtx.fillRect(0, 0, W, H);

  // Draw strokes in black
  offCtx.strokeStyle = '#000';
  offCtx.lineWidth = currentStrokeWidth;
  offCtx.lineCap = 'round';
  offCtx.lineJoin = 'round';
  offCtx.fillStyle = '#000';

  for (const s of parsed.strokes) {
    switch (s.type) {
      case 'line':
        offCtx.beginPath();
        offCtx.moveTo(s.x1, s.y1);
        offCtx.lineTo(s.x2, s.y2);
        offCtx.stroke();
        break;
      case 'rect':
        offCtx.strokeRect(s.x, s.y, s.w, s.h);
        break;
      case 'ellipse':
        offCtx.beginPath();
        offCtx.ellipse(s.cx, s.cy, Math.abs(s.rx), Math.abs(s.ry), 0, 0, Math.PI * 2);
        offCtx.stroke();
        break;
      case 'arc':
        offCtx.beginPath();
        offCtx.arc(s.cx, s.cy, s.r, s.start, s.end);
        offCtx.stroke();
        break;
      case 'text':
        offCtx.font = `${s.size}px 'SF Mono', 'Consolas', monospace`;
        offCtx.fillText(s.content, s.x, s.y + s.size);
        break;
    }
  }

  // Sample each grid cell — count dark pixels → density
  const imgData = offCtx.getImageData(0, 0, W, H);
  const d = imgData.data;

  const matrix = [];
  for (let row = 0; row < gridRows; row++) {
    const line = [];
    for (let col = 0; col < gridCols; col++) {
      const x0 = Math.floor(col * cellW);
      const y0 = Math.floor(row * cellH);
      const x1 = Math.floor((col + 1) * cellW);
      const y1 = Math.floor((row + 1) * cellH);

      let darkPixels = 0;
      let totalPixels = 0;
      for (let y = y0; y < y1 && y < H; y++) {
        for (let x = x0; x < x1 && x < W; x++) {
          const idx = (y * W + x) * 4;
          const brightness = (d[idx] + d[idx+1] + d[idx+2]) / 3;
          if (brightness < 200) darkPixels++;
          totalPixels++;
        }
      }

      const density = totalPixels > 0 ? darkPixels / totalPixels : 0;
      line.push(density);
    }
    matrix.push(line);
  }

  return { matrix, gridCols, gridRows };
}

function matrixToText(matrixData, charset) {
  const { matrix, gridCols, gridRows } = matrixData;

  const DENSITY_CHARS = ' .·:;+*#@';
  const BLOCK_CHARS = ' ░▒▓█';
  const DIGIT_CHARS = '.0123456789';

  const lines = [];
  for (let row = 0; row < gridRows; row++) {
    let line = '';
    for (let col = 0; col < gridCols; col++) {
      const d = matrix[row][col];
      let ch;
      if (charset === 'density') {
        const idx = Math.min(DENSITY_CHARS.length - 1, Math.floor(d * DENSITY_CHARS.length));
        ch = DENSITY_CHARS[idx];
      } else if (charset === 'block') {
        const idx = Math.min(BLOCK_CHARS.length - 1, Math.floor(d * BLOCK_CHARS.length));
        ch = BLOCK_CHARS[idx];
      } else {
        const idx = Math.min(DIGIT_CHARS.length - 1, Math.floor(d * DIGIT_CHARS.length));
        ch = DIGIT_CHARS[idx];
      }
      line += ch;
    }
    lines.push(line);
  }

  return lines.join('\n');
}


// ── Main Render Pipeline ───────────────────────────────────────────

let lastParsed = null;

function render() {
  const code = editor.value;
  if (!code.trim()) {
    statusText.textContent = 'Empty';
    strokeCount.textContent = '';
    matrixContent.textContent = '';
    return;
  }

  try {
    const parsed = parseSketch(code);
    lastParsed = parsed;
    renderSketch(parsed);

    statusText.textContent = `${parsed.W}×${parsed.H}`;
    strokeCount.textContent = `${parsed.strokes.length} strokes`;
    info.textContent = `${parsed.W}×${parsed.H}`;

    // Generate vision matrix
    const gridCols = Number(document.getElementById('matrix-res').value) || 48;
    const charset = document.getElementById('matrix-charset').value;
    const matrixData = generateMatrix(parsed, gridCols);
    matrixContent.textContent = matrixToText(matrixData, charset);

  } catch (e) {
    statusText.textContent = 'Error: ' + e.message;
  }
}


// ── Editor ─────────────────────────────────────────────────────────

const editor = document.getElementById('editor');
const lineNumbersEl = document.getElementById('line-numbers');
const statusText = document.getElementById('status-text');
const strokeCount = document.getElementById('stroke-count');
const matrixContent = document.getElementById('matrix-content');
const info = document.getElementById('info');

function updateLineNumbers() {
  const lines = editor.value.split('\n').length;
  lineNumbersEl.textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
}

editor.addEventListener('scroll', () => { lineNumbersEl.scrollTop = editor.scrollTop; });

let renderTimer = null;
editor.addEventListener('input', () => {
  updateLineNumbers();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 100);
});

// Controls
document.getElementById('zoom').addEventListener('change', e => {
  currentZoom = Number(e.target.value); render();
});
document.getElementById('stroke-width').addEventListener('change', e => {
  currentStrokeWidth = Number(e.target.value); render();
});
document.getElementById('matrix-res').addEventListener('change', render);
document.getElementById('matrix-charset').addEventListener('change', render);

// Export
document.getElementById('btn-export').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'sketch.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// Copy matrix
document.getElementById('btn-copy-matrix').addEventListener('click', () => {
  navigator.clipboard.writeText(matrixContent.textContent);
  document.getElementById('btn-copy-matrix').textContent = 'Copied!';
  setTimeout(() => document.getElementById('btn-copy-matrix').textContent = 'Copy Matrix', 1500);
});
