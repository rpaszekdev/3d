<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VOXI Training Data Reviewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232733;
    --border: #2d3244; --text: #e0e0e8; --dim: #8888a0;
    --green: #2ecc71; --red: #e74c3c; --yellow: #f39c12; --accent: #6c8cff;
  }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

  .header {
    height: 50px; display: flex; align-items: center; gap: 16px;
    padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 15px; }
  .header .accent { color: var(--accent); }
  .header .spacer { flex: 1; }
  .header .stats { font-size: 12px; color: var(--dim); }
  .header .counter { font-size: 14px; font-weight: 600; color: var(--accent); }

  .main { display: flex; height: calc(100vh - 50px); }

  .sidebar {
    width: 280px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .file-list { flex: 1; overflow-y: auto; padding: 8px; }
  .file-item {
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    font-family: monospace; margin-bottom: 2px; display: flex; align-items: center; gap: 8px;
  }
  .file-item:hover { background: var(--surface2); }
  .file-item.active { background: var(--accent); color: #fff; }
  .file-item.approved { border-left: 3px solid var(--green); }
  .file-item.rejected { border-left: 3px solid var(--red); opacity: 0.5; }
  .file-item.pending { border-left: 3px solid var(--dim); }
  .file-item .badge {
    font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 600;
  }
  .badge.approved { background: var(--green); color: #000; }
  .badge.rejected { background: var(--red); color: #fff; }

  .content { flex: 1; display: flex; flex-direction: column; }

  .canvas-area { flex: 1; position: relative; background: #13151f; }
  .canvas-area iframe { width: 100%; height: 100%; border: none; }

  .info-bar {
    padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--border);
    font-size: 12px; color: var(--dim); display: flex; gap: 20px; align-items: center;
  }
  .info-bar .name { color: var(--text); font-weight: 600; font-size: 14px; }

  .controls {
    display: flex; gap: 12px; padding: 12px 20px;
    background: var(--surface2); border-top: 1px solid var(--border); align-items: center;
  }
  .btn {
    padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-approve { background: var(--green); color: #000; }
  .btn-reject { background: var(--red); color: #fff; }
  .btn-skip { background: var(--surface); color: var(--dim); border: 1px solid var(--border); }
  .btn-export { background: var(--accent); color: #fff; margin-left: auto; }
  .btn:hover { filter: brightness(1.1); }

  .keyboard-hint { font-size: 11px; color: var(--dim); }
  kbd { background: var(--surface); border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px; font-size: 10px; }

  .code-panel {
    width: 320px; background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 12px; font-family: 'SF Mono', monospace; font-size: 11px;
    line-height: 1.6; color: var(--dim); white-space: pre-wrap;
  }
  .code-panel .comment { color: var(--green); }
  .code-panel .primitive { color: var(--accent); }
  .code-panel .grid { color: var(--yellow); }
</style>
</head>
<body>

<div class="header">
  <h1>VOXI <span class="accent">Training Data Reviewer</span></h1>
  <div class="spacer"></div>
  <div class="counter" id="counter">0 / 0</div>
  <div class="stats" id="stats">
    <span style="color:var(--green)">0 approved</span> ·
    <span style="color:var(--red)">0 rejected</span> ·
    <span>0 pending</span>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="file-list" id="file-list"></div>
  </div>

  <div class="content">
    <div class="canvas-area" id="canvas-area">
      <div id="renderer-placeholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--dim)">
        Loading renderer...
      </div>
    </div>

    <div class="info-bar">
      <span class="name" id="current-name">—</span>
      <span id="current-stats">—</span>
    </div>

    <div class="controls">
      <button class="btn btn-approve" onclick="approve()">Approve</button>
      <button class="btn btn-reject" onclick="reject()">Reject</button>
      <button class="btn btn-skip" onclick="skip()">Skip</button>
      <div class="keyboard-hint">
        <kbd>A</kbd> approve · <kbd>R</kbd> reject · <kbd>S</kbd> skip · <kbd>←</kbd><kbd>→</kbd> navigate · <kbd>E</kbd> export
      </div>
      <button class="btn btn-export" onclick="exportApproved()">Export Approved</button>
    </div>
  </div>

  <div class="code-panel" id="code-panel">Select a file to view code...</div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────

let files = [];        // { name, code, status: 'pending'|'approved'|'rejected' }
let currentIdx = 0;
let rendererReady = false;

// ── Load files from directory listing ─────────────────────────────

async function loadFiles() {
  // Fetch directory listing — we'll use a simple approach
  // Load the JSONL file to get the data
  try {
    const resp = await fetch('train-clean.jsonl');
    const text = await resp.text();
    const lines = text.trim().split('\n').filter(Boolean);

    files = lines.map((line, i) => {
      const entry = JSON.parse(line);
      // Extract description from instruction
      const desc = entry.instruction.replace(/^(Generate a VOXI voxel model of: |Create a 3D voxel model: |VOXI code for: )/, '');
      return {
        name: desc,
        code: entry.output,
        category: entry.category,
        stats: entry.stats,
        status: 'pending',
        index: i,
      };
    });

    renderFileList();
    if (files.length > 0) selectFile(0);
    updateStats();
  } catch (e) {
    document.getElementById('renderer-placeholder').textContent = 'Error loading train-clean.jsonl: ' + e.message;
  }
}

// ── Renderer ──────────────────────────────────────────────────────

function loadInRenderer(code) {
  const area = document.getElementById('canvas-area');

  // Use v4-voxel.html as iframe renderer
  let iframe = area.querySelector('iframe');
  if (!iframe) {
    const placeholder = document.getElementById('renderer-placeholder');
    if (placeholder) placeholder.remove();

    iframe = document.createElement('iframe');
    iframe.src = '../v4-voxel.html';
    iframe.id = 'renderer-iframe';
    area.appendChild(iframe);

    iframe.onload = () => {
      rendererReady = true;
      // Wait for Three.js to initialize
      setTimeout(() => {
        setCode(code);
      }, 1500);
    };
  } else if (rendererReady) {
    setCode(code);
  }
}

function setCode(code) {
  const iframe = document.getElementById('renderer-iframe');
  if (!iframe || !iframe.contentWindow) return;
  try {
    // Use the global voxelSetCode function
    if (iframe.contentWindow.voxelSetCode) {
      iframe.contentWindow.voxelSetCode(code);
      // Reset camera for good view
      setTimeout(() => {
        if (iframe.contentWindow.resetCamera) {
          iframe.contentWindow.resetCamera();
        }
      }, 200);
    }
  } catch (e) {
    console.error('Failed to set code:', e);
  }
}

// ── File list ─────────────────────────────────────────────────────

function renderFileList() {
  const list = document.getElementById('file-list');
  list.innerHTML = files.map((f, i) => {
    const statusClass = f.status;
    const activeClass = i === currentIdx ? 'active' : '';
    const badge = f.status !== 'pending'
      ? `<span class="badge ${f.status}">${f.status === 'approved' ? '✓' : '✗'}</span>`
      : '';
    return `<div class="file-item ${statusClass} ${activeClass}" onclick="selectFile(${i})" title="${f.name}">
      ${badge}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
    </div>`;
  }).join('');
}

function selectFile(idx) {
  if (idx < 0 || idx >= files.length) return;
  currentIdx = idx;
  const file = files[idx];

  // Update code panel with syntax highlighting
  const highlighted = file.code.split('\n').map(line => {
    const trimmed = line.trim();
    if (trimmed.startsWith('--')) return `<span class="comment">${esc(line)}</span>`;
    if (trimmed.startsWith('V ')) return `<span class="grid">${esc(line)}</span>`;
    if (/^[BSCEKPD]\s/.test(trimmed)) return `<span class="primitive">${esc(line)}</span>`;
    return esc(line);
  }).join('\n');
  document.getElementById('code-panel').innerHTML = highlighted;

  // Update info
  document.getElementById('current-name').textContent = `${file.category} / ${file.name}`;
  document.getElementById('current-stats').textContent =
    `${file.stats.primitives} primitives · ${file.stats.colors} colors · ${file.stats.lines} lines`;
  document.getElementById('counter').textContent = `${idx + 1} / ${files.length}`;

  // Load in renderer
  loadInRenderer(file.code);
  renderFileList();
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Actions ───────────────────────────────────────────────────────

function approve() {
  if (currentIdx >= files.length) return;
  files[currentIdx].status = 'approved';
  updateStats();
  next();
}

function reject() {
  if (currentIdx >= files.length) return;
  files[currentIdx].status = 'rejected';
  updateStats();
  next();
}

function skip() { next(); }

function next() {
  // Go to next pending
  for (let i = currentIdx + 1; i < files.length; i++) {
    if (files[i].status === 'pending') { selectFile(i); return; }
  }
  // Wrap around
  for (let i = 0; i < currentIdx; i++) {
    if (files[i].status === 'pending') { selectFile(i); return; }
  }
  // All reviewed
  selectFile(Math.min(currentIdx + 1, files.length - 1));
}

function prev() {
  selectFile(Math.max(0, currentIdx - 1));
}

function updateStats() {
  const approved = files.filter(f => f.status === 'approved').length;
  const rejected = files.filter(f => f.status === 'rejected').length;
  const pending = files.filter(f => f.status === 'pending').length;
  document.getElementById('stats').innerHTML =
    `<span style="color:var(--green)">${approved} approved</span> · ` +
    `<span style="color:var(--red)">${rejected} rejected</span> · ` +
    `<span>${pending} pending</span>`;
}

// ── Export ─────────────────────────────────────────────────────────

function exportApproved() {
  const approved = files.filter(f => f.status === 'approved');
  if (approved.length === 0) {
    alert('No approved files yet!');
    return;
  }

  // Build clean JSONL
  const jsonl = approved.map(f => JSON.stringify({
    instruction: `Generate a VOXI voxel model of: ${f.name}`,
    output: f.code,
    category: f.category,
  })).join('\n');

  // Download as file
  const blob = new Blob([jsonl], { type: 'application/jsonl' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `train-approved-${approved.length}.jsonl`;
  a.click();
  URL.revokeObjectURL(url);

  alert(`Exported ${approved.length} approved examples!`);
}

// ── Keyboard shortcuts ────────────────────────────────────────────

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch (e.key.toLowerCase()) {
    case 'a': approve(); break;
    case 'r': reject(); break;
    case 's': skip(); break;
    case 'e': exportApproved(); break;
    case 'arrowleft': prev(); break;
    case 'arrowright': next(); break;
  }
});

// ── Init ──────────────────────────────────────────────────────────

loadFiles();
</script>
</body>
</html>
