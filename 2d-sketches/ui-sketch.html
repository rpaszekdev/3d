<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXI UI Sketch — 2D Layout with Depth</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #232733;
    --border: #2d3244; --text: #e0e0e8; --text-dim: #8888a0;
    --accent: #6c8cff; --canvas-bg: #13151f;
    --highlight: rgba(108, 140, 255, 0.3);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }

  /* Header */
  .header {
    height: 40px; display: flex; align-items: center; gap: 10px;
    padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .header h1 { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .header h1 .accent { color: var(--accent); }
  .header select, .header button {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); padding: 4px 10px; font-size: 11px; cursor: pointer;
  }
  .header select:hover, .header button:hover { border-color: var(--accent); }
  .header .spacer { flex: 1; }
  .header .info { font-size: 11px; color: var(--text-dim); }
  .header label { font-size: 11px; color: var(--text-dim); }
  .mode-btn { font-size: 11px !important; }
  .mode-btn.active { border-color: var(--accent) !important; color: var(--accent) !important; }

  /* Layout */
  .split { display: flex; height: calc(100vh - 40px); }

  /* Editor */
  .editor-pane {
    width: 420px; min-width: 300px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); background: var(--surface);
  }
  .editor-wrap { flex: 1; position: relative; overflow: hidden; }
  .line-numbers {
    position: absolute; left: 0; top: 0; bottom: 0; width: 32px;
    background: var(--surface2); color: var(--text-dim); font-size: 12px;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    line-height: 1.6; padding: 8px 4px; text-align: right; overflow: hidden;
    user-select: none; border-right: 1px solid var(--border);
  }
  .line-numbers .hl { background: var(--highlight); color: var(--accent); }
  textarea {
    position: absolute; left: 32px; top: 0; right: 0; bottom: 0;
    background: transparent; color: var(--text); border: none; resize: none;
    font-size: 12px; font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    line-height: 1.6; padding: 8px; outline: none; tab-size: 4;
    white-space: pre; overflow: auto;
  }
  textarea::placeholder { color: var(--text-dim); }

  .format-ref {
    padding: 6px 8px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--text-dim); line-height: 1.7;
    background: var(--surface2);
  }
  .format-ref code { color: var(--accent); }
  .status {
    height: 24px; display: flex; align-items: center; padding: 0 8px;
    font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border);
  }
  .status .ok { color: #4caf50; }
  .status .spacer { flex: 1; }

  /* Canvas */
  .canvas-pane {
    flex: 1; background: var(--canvas-bg); overflow: auto;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .canvas-wrap {
    position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  #main-canvas { display: block; }

  /* Layer list */
  .layer-panel {
    width: 200px; border-left: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column;
  }
  .layer-panel-title {
    font-size: 11px; font-weight: 600; padding: 8px; color: var(--text-dim);
    border-bottom: 1px solid var(--border); background: var(--surface2);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .layer-list {
    flex: 1; overflow-y: auto; font-size: 11px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .layer-item {
    padding: 4px 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .layer-item:hover { background: var(--surface2); }
  .layer-item.selected { background: var(--highlight); }
  .layer-swatch {
    width: 12px; height: 12px; border-radius: 2px;
    border: 1px solid var(--border); flex-shrink: 0;
  }
  .layer-z {
    font-size: 9px; color: var(--text-dim); margin-left: auto;
    background: var(--surface2); padding: 1px 4px; border-radius: 3px;
  }

</style>
</head>
<body>

<div class="header">
  <h1>VOXI <span class="accent">UI Sketch</span></h1>
  <select id="examples"><option value="">— examples —</option></select>
  <label>Zoom:</label>
  <select id="zoom">
    <option value="0.25">25%</option>
    <option value="0.5" selected>50%</option>
    <option value="0.75">75%</option>
    <option value="1">100%</option>
  </select>
  <label>Mode:</label>
  <button class="mode-btn active" data-mode="flat">Flat</button>
  <button class="mode-btn" data-mode="depth">Depth</button>
  <button class="mode-btn" data-mode="shaded">Shaded</button>
  <button class="mode-btn" data-mode="layers">Layers</button>
  <div class="spacer"></div>
  <button id="btn-export">Export PNG</button>
  <span class="info" id="info"></span>
</div>

<div class="split">
  <div class="editor-pane">
    <div class="editor-wrap">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="editor" spellcheck="false" placeholder="CANVAS 1440 900 #1a1a1a&#10;RECT 0 0 1440 60 3 #333&#10;TEXT 20 20 &quot;Hello&quot; 24 3 #fff"></textarea>
    </div>
    <div class="format-ref">
      <code>CANVAS w h [bg]</code> &middot;
      <code>RECT x y w h z color [r]</code> &middot;
      <code>TEXT x y "str" size z color [bold]</code><br>
      <code>IMG x y w h z [label]</code> &middot;
      <code>LINE x1 y1 x2 y2 z color [w]</code> &middot;
      <code>ELLIPSE cx cy rx ry z color</code><br>
      <code>VOXI x y w h z yaw pitch</code>...<code>/VOXI</code> 3D scene &middot;
      z = depth layer (0=back, higher=front) &middot; <code>--</code> comment
    </div>
    <div class="status">
      <span id="status-text" class="ok">Ready</span>
      <span class="spacer"></span>
      <span id="el-count"></span>
    </div>
  </div>

  <div class="canvas-pane" id="canvas-pane">
    <div class="canvas-wrap">
      <canvas id="main-canvas"></canvas>
    </div>
  </div>

  <div class="layer-panel">
    <div class="layer-panel-title">Layers</div>
    <div class="layer-list" id="layer-list"></div>
  </div>

</div>

<script>
// ── VOXI 3D Engine (embedded from text-view.js) ───────────────────

const VOXI_COLORS = [
  0x111111, 0xe53935, 0x43a047, 0x1e88e5,
  0x00bcd4, 0xab47bc, 0xfdd835, 0xff9800,
  0xeeeeee, 0x9e9e9e, 0x8d6e4a, 0xff9eb5,
  0x2e7d32, 0xd4b896, 0x8b1a1a, 0x1a3a6b,
];
const VOXI_CKEYS = '0123456789abcdef';

function parseVoxi(code) {
  let W = 32, H = 32, D = 32;
  const vm = new Map();
  const set = (x, y, z, c) => {
    const ix = Math.round(x), iy = Math.round(y), iz = Math.round(z);
    if (ix >= 0 && ix < W && iy >= 0 && iy < H && iz >= 0 && iz < D)
      vm.set(`${ix},${iy},${iz}`, Math.min(Math.max(c || 9, 0), 15));
  };
  const addBox = (px, py, pz, w, h, d, c) => {
    for (let x = px; x < px + w; x++)
      for (let y = py; y < py + h; y++)
        for (let z = pz; z < pz + d; z++) set(x, y, z, c);
  };
  const addSphere = (cx, cy, cz, r, c) => {
    const r2 = r * r;
    for (let x = cx - r; x <= cx + r; x++)
      for (let y = cy - r; y <= cy + r; y++)
        for (let z = cz - r; z <= cz + r; z++)
          if ((x - cx) ** 2 + (y - cy) ** 2 + (z - cz) ** 2 <= r2) set(x, y, z, c);
  };
  const addCyl = (cx, cy, cz, r, h, c) => {
    const r2 = r * r;
    for (let x = cx - r; x <= cx + r; x++)
      for (let z = cz - r; z <= cz + r; z++)
        if ((x - cx) ** 2 + (z - cz) ** 2 <= r2)
          for (let y = cy; y < cy + h; y++) set(x, y, z, c);
  };
  const addCone = (cx, cy, cz, r, h, c) => {
    for (let y = 0; y < h; y++) {
      const rr = r * (1 - y / h), rr2 = rr * rr;
      for (let x = cx - r; x <= cx + r; x++)
        for (let z = cz - r; z <= cz + r; z++)
          if ((x - cx) ** 2 + (z - cz) ** 2 <= rr2) set(cx + (x - cx), cy + y, cz + (z - cz), c);
    }
  };
  const addEllipsoid = (cx, cy, cz, rx, ry, rz, c) => {
    for (let x = cx - rx; x <= cx + rx; x++)
      for (let y = cy - ry; y <= cy + ry; y++)
        for (let z = cz - rz; z <= cz + rz; z++)
          if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + ((z - cz) / rz) ** 2 <= 1)
            set(x, y, z, c);
  };
  const addDome = (px, py, pz, w, h, d, c) => {
    const rx = w / 2, ry = h, rz = d / 2, cx = px + rx, cz = pz + rz;
    for (let x = px; x < px + w; x++)
      for (let y = py; y < py + h; y++)
        for (let z = pz; z < pz + d; z++)
          if (((x - cx + .5) / rx) ** 2 + ((y - py) / ry) ** 2 + ((z - cz + .5) / rz) ** 2 <= 1)
            set(x, y, z, c);
  };
  const groups = {};
  let currentGroup = null, currentGroupName = null, scale = 1;

  function scaled(cmd, n) {
    if (scale === 1) return n;
    const s = [...n];
    switch (cmd) {
      case 'B': case 'D':
        s[0]=Math.round(s[0]*scale); s[1]=Math.round(s[1]*scale); s[2]=Math.round(s[2]*scale);
        s[3]=Math.max(1,Math.round(s[3]*scale)); s[4]=Math.max(1,Math.round(s[4]*scale)); s[5]=Math.max(1,Math.round(s[5]*scale)); break;
      case 'S':
        s[0]=Math.round(s[0]*scale); s[1]=Math.round(s[1]*scale); s[2]=Math.round(s[2]*scale);
        s[3]=Math.max(1,Math.round(s[3]*scale)); break;
      case 'C': case 'K':
        s[0]=Math.round(s[0]*scale); s[1]=Math.round(s[1]*scale); s[2]=Math.round(s[2]*scale);
        s[3]=Math.max(1,Math.round(s[3]*scale)); s[4]=Math.max(1,Math.round(s[4]*scale)); break;
      case 'P':
        s[0]=Math.round(s[0]*scale); s[1]=Math.round(s[1]*scale); s[2]=Math.round(s[2]*scale); break;
      case 'E':
        s[0]=Math.round(s[0]*scale); s[1]=Math.round(s[1]*scale); s[2]=Math.round(s[2]*scale);
        s[3]=Math.max(1,Math.round(s[3]*scale)); s[4]=Math.max(1,Math.round(s[4]*scale)); s[5]=Math.max(1,Math.round(s[5]*scale)); break;
    }
    return s;
  }
  function execCmd(cmd, n) {
    const sn = scaled(cmd, n);
    switch (cmd) {
      case 'B': addBox(sn[0],sn[1],sn[2],sn[3],sn[4],sn[5],sn[6]); break;
      case 'S': addSphere(sn[0],sn[1],sn[2],sn[3],sn[4]); break;
      case 'C': addCyl(sn[0],sn[1],sn[2],sn[3],sn[4],sn[5]); break;
      case 'K': addCone(sn[0],sn[1],sn[2],sn[3],sn[4],sn[5]); break;
      case 'P': set(sn[0],sn[1],sn[2],sn[3]); break;
      case 'E': addEllipsoid(sn[0],sn[1],sn[2],sn[3],sn[4],sn[5],sn[6]); break;
      case 'D': addDome(sn[0],sn[1],sn[2],sn[3],sn[4],sn[5],sn[6]); break;
      default: return false;
    }
    return true;
  }
  function placeGroup(name, ox, oy, oz) {
    const g = groups[name]; if (!g) return;
    const sox=Math.round(ox*scale), soy=Math.round(oy*scale), soz=Math.round(oz*scale);
    for (const entry of g) {
      const sn = scaled(entry.cmd, entry.args);
      sn[0]+=sox; sn[1]+=soy; sn[2]+=soz;
      execCmd(entry.cmd, sn);
    }
  }

  const allLines = code.split('\n');
  for (let i = 0; i < allLines.length; i++) {
    const line = allLines[i].trim();
    if (!line || line.startsWith('--') || line.startsWith('//')) continue;
    const p = line.split(/\s+/);
    const cmd = p[0].toUpperCase();
    if (cmd === 'G') { currentGroupName = p[1]||`g${i}`; currentGroup = []; continue; }
    if (cmd === '/G') { if (currentGroup && currentGroupName) groups[currentGroupName]=currentGroup; currentGroup=null; currentGroupName=null; continue; }
    if (cmd === '@') { placeGroup(p[1], Number(p[2])||0, Number(p[3])||0, Number(p[4])||0); continue; }
    if (cmd === 'V') { W=Number(p[1])||32; H=Number(p[2])||32; D=Number(p[3])||32; continue; }
    if (cmd === 'R') { scale=Number(p[1])||1; continue; }
    const parseArg = (s, isColor) => {
      if (isColor && /^[a-f]$/i.test(s)) return VOXI_CKEYS.indexOf(s.toLowerCase());
      return Number(s);
    };
    const rawArgs = p.slice(1);
    const n = rawArgs.map((s, idx) => parseArg(s, idx === rawArgs.length - 1));
    execCmd(cmd, n);
    if (currentGroup) currentGroup.push({ cmd, args: n });
  }
  return { W, H, D, vm };
}

/**
 * Render VOXI scene with rotated orthographic projection.
 * Returns an ImageData-like pixel buffer { data: Uint8Array, width, height }
 * with depth info per pixel.
 *
 * yaw/pitch in degrees. yaw rotates around Y axis, pitch around X axis.
 */
function renderVoxiRotated(voxiCode, outW, outH, yaw, pitch) {
  const { W, H, D, vm } = parseVoxi(voxiCode);
  if (vm.size === 0) return null;

  const yr = yaw * Math.PI / 180;
  const pr = pitch * Math.PI / 180;
  const cosY = Math.cos(yr), sinY = Math.sin(yr);
  const cosP = Math.cos(pr), sinP = Math.sin(pr);

  // Center of voxel grid
  const cx = W / 2, cy = H / 2, cz = D / 2;

  // Rotate point around center: yaw (Y) then pitch (X)
  function rotate(x, y, z) {
    let dx = x - cx, dy = y - cy, dz = z - cz;
    // Yaw (around Y)
    const rx = dx * cosY + dz * sinY;
    const rz = -dx * sinY + dz * cosY;
    dx = rx;
    dz = rz;
    // Pitch (around X)
    const ry = dy * cosP - dz * sinP;
    const rz2 = dy * sinP + dz * cosP;
    return [dx, ry, rz2];
  }

  // Find bounding box of rotated scene
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;
  for (const corner of [[0,0,0],[W,0,0],[0,H,0],[0,0,D],[W,H,0],[W,0,D],[0,H,D],[W,H,D]]) {
    const [rx, ry, rz] = rotate(corner[0], corner[1], corner[2]);
    minX = Math.min(minX, rx); maxX = Math.max(maxX, rx);
    minY = Math.min(minY, ry); maxY = Math.max(maxY, ry);
    minZ = Math.min(minZ, rz); maxZ = Math.max(maxZ, rz);
  }

  const sceneW = maxX - minX || 1;
  const sceneH = maxY - minY || 1;
  const scaleF = Math.min(outW / sceneW, outH / sceneH) * 0.92;

  // Z-buffer
  const zbuf = new Float32Array(outW * outH).fill(Infinity);
  const colorBuf = new Int8Array(outW * outH).fill(-1);
  const depthBuf = new Float32Array(outW * outH).fill(0);

  for (const [k, c] of vm) {
    const [vx, vy, vz] = k.split(',').map(Number);
    // Rotate voxel center
    const [rx, ry, rz] = rotate(vx + 0.5, vy + 0.5, vz + 0.5);

    // Project to screen (orthographic, Y flipped)
    const sx = Math.round((rx - minX) * scaleF + (outW - sceneW * scaleF) / 2);
    const sy = Math.round((maxY - ry) * scaleF + (outH - sceneH * scaleF) / 2);

    // Fill a block of pixels per voxel (based on scale)
    const voxSize = Math.max(1, Math.round(scaleF));
    for (let dy = 0; dy < voxSize; dy++) {
      for (let dx = 0; dx < voxSize; dx++) {
        const px = sx + dx, py = sy + dy;
        if (px < 0 || px >= outW || py < 0 || py >= outH) continue;
        const idx = py * outW + px;
        if (rz < zbuf[idx]) {
          zbuf[idx] = rz;
          colorBuf[idx] = c;
          depthBuf[idx] = (rz - minZ) / (maxZ - minZ || 1);
        }
      }
    }
  }

  return { colorBuf, depthBuf, width: outW, height: outH, voxelCount: vm.size };
}


// ── Parser ─────────────────────────────────────────────────────────

function parseUI(code) {
  let canvasW = 1440, canvasH = 900, canvasBg = '#1a1a1a';
  const elements = [];

  const lines = code.split('\n');
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const trimmed = raw.trim();
    if (!trimmed || trimmed.startsWith('--') || trimmed.startsWith('//')) continue;

    // Tokenize respecting quoted strings
    const tokens = [];
    let j = 0;
    while (j < trimmed.length) {
      if (trimmed[j] === ' ' || trimmed[j] === '\t') { j++; continue; }
      if (trimmed[j] === '"') {
        const end = trimmed.indexOf('"', j + 1);
        if (end === -1) { tokens.push(trimmed.slice(j + 1)); j = trimmed.length; }
        else { tokens.push(trimmed.slice(j + 1, end)); j = end + 1; }
      } else {
        const end = trimmed.indexOf(' ', j);
        if (end === -1) { tokens.push(trimmed.slice(j)); j = trimmed.length; }
        else { tokens.push(trimmed.slice(j, end)); j = end + 1; }
      }
    }

    const cmd = tokens[0].toUpperCase();

    if (cmd === 'CANVAS' || cmd === 'C') {
      canvasW = Number(tokens[1]) || 1440;
      canvasH = Number(tokens[2]) || 900;
      canvasBg = tokens[3] || '#1a1a1a';
      continue;
    }

    if (cmd === 'RECT' || cmd === 'R') {
      elements.push({
        type: 'rect', line: i,
        x: Number(tokens[1]) || 0, y: Number(tokens[2]) || 0,
        w: Number(tokens[3]) || 100, h: Number(tokens[4]) || 50,
        z: Number(tokens[5]) || 0, color: tokens[6] || '#888',
        radius: Number(tokens[7]) || 0,
      });
    } else if (cmd === 'TEXT' || cmd === 'T') {
      elements.push({
        type: 'text', line: i,
        x: Number(tokens[1]) || 0, y: Number(tokens[2]) || 0,
        content: tokens[3] || '', size: Number(tokens[4]) || 16,
        z: Number(tokens[5]) || 0, color: tokens[6] || '#fff',
        weight: (tokens[7] || 'normal').toLowerCase(),
      });
    } else if (cmd === 'IMG' || cmd === 'I') {
      elements.push({
        type: 'img', line: i,
        x: Number(tokens[1]) || 0, y: Number(tokens[2]) || 0,
        w: Number(tokens[3]) || 200, h: Number(tokens[4]) || 150,
        z: Number(tokens[5]) || 0, label: tokens[6] || 'image',
      });
    } else if (cmd === 'LINE' || cmd === 'L') {
      elements.push({
        type: 'line', line: i,
        x1: Number(tokens[1]) || 0, y1: Number(tokens[2]) || 0,
        x2: Number(tokens[3]) || 100, y2: Number(tokens[4]) || 0,
        z: Number(tokens[5]) || 0, color: tokens[6] || '#fff',
        width: Number(tokens[7]) || 1,
      });
    } else if (cmd === 'ELLIPSE' || cmd === 'E') {
      elements.push({
        type: 'ellipse', line: i,
        cx: Number(tokens[1]) || 0, cy: Number(tokens[2]) || 0,
        rx: Number(tokens[3]) || 50, ry: Number(tokens[4]) || 50,
        z: Number(tokens[5]) || 0, color: tokens[6] || '#888',
      });
    } else if (cmd === 'VOXI') {
      // VOXI x y w h z yaw pitch
      // ... voxi code lines ...
      // /VOXI
      const vx = Number(tokens[1]) || 0, vy = Number(tokens[2]) || 0;
      const vw = Number(tokens[3]) || 200, vh = Number(tokens[4]) || 200;
      const vz = Number(tokens[5]) || 0;
      const vyaw = Number(tokens[6]) || 35, vpitch = Number(tokens[7]) || 25;
      // Collect lines until /VOXI
      const voxiLines = [];
      const startLine = i;
      i++;
      while (i < lines.length) {
        const vl = lines[i].trim();
        if (vl.toUpperCase() === '/VOXI') break;
        voxiLines.push(lines[i]);
        i++;
      }
      elements.push({
        type: 'voxi', line: startLine,
        x: vx, y: vy, w: vw, h: vh, z: vz,
        yaw: vyaw, pitch: vpitch,
        voxiCode: voxiLines.join('\n'),
        _cachedRender: null,
      });
    }
  }

  // Sort by z (painter's algorithm: low z drawn first)
  elements.sort((a, b) => a.z - b.z);

  return { canvasW, canvasH, canvasBg, elements };
}


// ── Renderers ──────────────────────────────────────────────────────

function drawElement(ctx, el, mode, maxZ, highlight) {
  const z01 = maxZ <= 0 ? 0 : el.z / maxZ; // normalized depth 0..1

  function getColor() {
    if (mode === 'depth') {
      const v = Math.round(40 + 215 * z01);
      return `rgb(${v},${v},${v})`;
    }
    if (mode === 'shaded') {
      // Parse color, darken by inverse depth (far = dark)
      const shade = 0.3 + 0.7 * z01;
      return shadeColor(el.color || '#888', shade);
    }
    return el.color || '#888';
  }

  ctx.save();

  // Layers mode: offset each layer vertically + add subtle border
  if (mode === 'layers') {
    const offsetY = -z01 * 60;
    const offsetX = z01 * 20;
    ctx.translate(offsetX, offsetY);
    ctx.shadowColor = 'rgba(0,0,0,0.3)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;
  }

  if (highlight) {
    ctx.shadowColor = '#6c8cff';
    ctx.shadowBlur = 12;
  }

  switch (el.type) {
    case 'rect': {
      const c = getColor();
      ctx.fillStyle = c;
      if (el.radius > 0) {
        roundRect(ctx, el.x, el.y, el.w, el.h, el.radius);
        ctx.fill();
      } else {
        ctx.fillRect(el.x, el.y, el.w, el.h);
      }
      if (mode === 'layers') {
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.lineWidth = 1;
        if (el.radius > 0) {
          roundRect(ctx, el.x, el.y, el.w, el.h, el.radius);
          ctx.stroke();
        } else {
          ctx.strokeRect(el.x, el.y, el.w, el.h);
        }
      }
      if (highlight) {
        ctx.strokeStyle = '#6c8cff';
        ctx.lineWidth = 2;
        ctx.strokeRect(el.x - 1, el.y - 1, el.w + 2, el.h + 2);
      }
      break;
    }
    case 'text': {
      const c = mode === 'depth'
        ? getColor()
        : mode === 'shaded'
          ? shadeColor(el.color || '#fff', 0.3 + 0.7 * z01)
          : el.color || '#fff';
      const weight = el.weight === 'bold' ? 'bold ' : '';
      ctx.font = `${weight}${el.size}px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif`;
      ctx.fillStyle = c;
      ctx.textBaseline = 'top';
      ctx.fillText(el.content, el.x, el.y);
      if (highlight) {
        const m = ctx.measureText(el.content);
        ctx.strokeStyle = '#6c8cff';
        ctx.lineWidth = 1;
        ctx.strokeRect(el.x - 2, el.y - 2, m.width + 4, el.size + 4);
      }
      break;
    }
    case 'img': {
      // Placeholder with cross
      const c = mode === 'depth' ? getColor() : (mode === 'shaded' ? shadeColor('#555', 0.3 + 0.7 * z01) : '#2a2a2a');
      ctx.fillStyle = c;
      ctx.fillRect(el.x, el.y, el.w, el.h);
      ctx.strokeStyle = mode === 'depth' ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.strokeRect(el.x, el.y, el.w, el.h);
      // Cross
      ctx.beginPath();
      ctx.moveTo(el.x, el.y); ctx.lineTo(el.x + el.w, el.y + el.h);
      ctx.moveTo(el.x + el.w, el.y); ctx.lineTo(el.x, el.y + el.h);
      ctx.stroke();
      // Label
      if (mode !== 'depth') {
        ctx.font = '12px -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(el.label || 'image', el.x + el.w / 2, el.y + el.h / 2);
        ctx.textAlign = 'start';
      }
      if (highlight) {
        ctx.strokeStyle = '#6c8cff';
        ctx.lineWidth = 2;
        ctx.strokeRect(el.x - 1, el.y - 1, el.w + 2, el.h + 2);
      }
      break;
    }
    case 'line': {
      const c = mode === 'depth' ? getColor() : (mode === 'shaded' ? shadeColor(el.color, 0.3 + 0.7 * z01) : el.color);
      ctx.strokeStyle = c;
      ctx.lineWidth = el.width || 1;
      ctx.beginPath();
      ctx.moveTo(el.x1, el.y1);
      ctx.lineTo(el.x2, el.y2);
      ctx.stroke();
      break;
    }
    case 'ellipse': {
      const c = getColor();
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.ellipse(el.cx, el.cy, el.rx, el.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      if (highlight) {
        ctx.strokeStyle = '#6c8cff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      break;
    }
    case 'voxi': {
      // Render 3D VOXI scene into the 2D layout
      if (!el._cachedRender || el._cachedRender._code !== el.voxiCode ||
          el._cachedRender._yaw !== el.yaw || el._cachedRender._pitch !== el.pitch) {
        el._cachedRender = renderVoxiRotated(el.voxiCode, el.w, el.h, el.yaw, el.pitch);
        if (el._cachedRender) {
          el._cachedRender._code = el.voxiCode;
          el._cachedRender._yaw = el.yaw;
          el._cachedRender._pitch = el.pitch;
        }
      }
      const vr = el._cachedRender;
      if (!vr) break;

      const imgData = ctx.createImageData(vr.width, vr.height);
      const d = imgData.data;
      for (let pi = 0; pi < vr.width * vr.height; pi++) {
        const ci = vr.colorBuf[pi];
        if (ci < 0) continue; // transparent — leave as 0,0,0,0
        let r, g, b;
        if (mode === 'depth') {
          const v = Math.round(40 + 215 * (1 - vr.depthBuf[pi]));
          r = g = b = v;
        } else if (mode === 'shaded') {
          const shade = 0.35 + 0.65 * (1 - vr.depthBuf[pi]);
          const hex = VOXI_COLORS[ci];
          r = Math.round(((hex >> 16) & 0xff) * shade);
          g = Math.round(((hex >> 8) & 0xff) * shade);
          b = Math.round((hex & 0xff) * shade);
        } else {
          const hex = VOXI_COLORS[ci];
          r = (hex >> 16) & 0xff;
          g = (hex >> 8) & 0xff;
          b = hex & 0xff;
        }
        const idx = pi * 4;
        d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
      }

      // Draw to an offscreen canvas first (so we can position it)
      const offCanvas = document.createElement('canvas');
      offCanvas.width = vr.width;
      offCanvas.height = vr.height;
      offCanvas.getContext('2d').putImageData(imgData, 0, 0);
      ctx.drawImage(offCanvas, el.x, el.y);

      if (highlight) {
        ctx.strokeStyle = '#6c8cff';
        ctx.lineWidth = 2;
        ctx.strokeRect(el.x - 1, el.y - 1, el.w + 2, el.h + 2);
      }
      break;
    }
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shadeColor(hex, factor) {
  // Parse hex or named color → shade by factor (0=black, 1=full)
  let r, g, b;
  if (hex.startsWith('#')) {
    const h = hex.slice(1);
    if (h.length === 3) {
      r = parseInt(h[0]+h[0], 16); g = parseInt(h[1]+h[1], 16); b = parseInt(h[2]+h[2], 16);
    } else {
      r = parseInt(h.slice(0,2), 16); g = parseInt(h.slice(2,4), 16); b = parseInt(h.slice(4,6), 16);
    }
  } else {
    // fallback
    r = g = b = 128;
  }
  r = Math.round(r * factor); g = Math.round(g * factor); b = Math.round(b * factor);
  return `rgb(${r},${g},${b})`;
}


// ── Main Render ────────────────────────────────────────────────────

const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
let currentMode = 'flat';
let currentZoom = 0.5;
let selectedLine = -1;
let parsedElements = [];

function render() {
  const code = editor.value;
  if (!code.trim()) {
    statusText.textContent = 'Empty';
    elCount.textContent = '';
    return;
  }

  try {
    const { canvasW, canvasH, canvasBg, elements } = parseUI(code);
    parsedElements = elements;

    canvas.width = canvasW;
    canvas.height = canvasH;
    canvas.style.width = (canvasW * currentZoom) + 'px';
    canvas.style.height = (canvasH * currentZoom) + 'px';

    // Background
    ctx.fillStyle = currentMode === 'depth' ? '#000' : canvasBg;
    ctx.fillRect(0, 0, canvasW, canvasH);

    const maxZ = elements.reduce((m, e) => Math.max(m, e.z), 0);

    // Draw all elements
    for (const el of elements) {
      drawElement(ctx, el, currentMode, maxZ, el.line === selectedLine);
    }

    // Depth legend for depth mode
    if (currentMode === 'depth' && maxZ > 0) {
      const lw = 120, lh = 16, lx = canvasW - lw - 12, ly = canvasH - lh - 12;
      for (let i = 0; i < lw; i++) {
        const t = i / lw;
        const v = Math.round(40 + 215 * t);
        ctx.fillStyle = `rgb(${v},${v},${v})`;
        ctx.fillRect(lx + i, ly, 1, lh);
      }
      ctx.font = '10px monospace';
      ctx.fillStyle = '#888';
      ctx.textBaseline = 'bottom';
      ctx.fillText('z=0', lx, ly - 2);
      ctx.textAlign = 'right';
      ctx.fillText(`z=${maxZ}`, lx + lw, ly - 2);
      ctx.textAlign = 'start';
    }

    statusText.className = 'ok';
    statusText.textContent = `${canvasW}×${canvasH}`;
    elCount.textContent = `${elements.length} elements · z 0–${maxZ}`;
    info.textContent = `${canvasW}×${canvasH} · ${currentMode}`;

    // Update layer panel
    updateLayers(elements);

  } catch (e) {
    statusText.className = '';
    statusText.textContent = 'Error: ' + e.message;
    console.error(e);
  }
}


// ── Layer Panel ────────────────────────────────────────────────────

function updateLayers(elements) {
  const list = document.getElementById('layer-list');
  // Show in reverse z order (top layer first)
  const sorted = [...elements].reverse();
  list.innerHTML = sorted.map(el => {
    const label = el.type === 'text' ? `"${el.content}"` :
                  el.type === 'img' ? `IMG ${el.label}` :
                  el.type === 'line' ? 'LINE' :
                  el.type === 'ellipse' ? 'ELLIPSE' :
                  el.type === 'voxi' ? `VOXI 3D ${el.w}×${el.h}` :
                  `RECT ${el.w}×${el.h}`;
    const sColor = el.color || (el.type === 'img' ? '#555' : '#888');
    const sel = el.line === selectedLine ? ' selected' : '';
    return `<div class="layer-item${sel}" data-line="${el.line}">
      <span class="layer-swatch" style="background:${sColor}"></span>
      <span>${label}</span>
      <span class="layer-z">z${el.z}</span>
    </div>`;
  }).join('');

  list.querySelectorAll('.layer-item').forEach(item => {
    item.addEventListener('click', () => {
      selectedLine = Number(item.dataset.line);
      render();
      highlightEditorLine(selectedLine);
    });
  });
}

function highlightEditorLine(lineIdx) {
  // Scroll editor to show the line
  const lines = editor.value.split('\n');
  let charPos = 0;
  for (let i = 0; i < lineIdx && i < lines.length; i++) {
    charPos += lines[i].length + 1;
  }
  editor.focus();
  editor.setSelectionRange(charPos, charPos + (lines[lineIdx] || '').length);

  // Update line number highlights
  updateLineNumbers();
}




// ── Canvas Click → Select Element ──────────────────────────────────

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / currentZoom;
  const my = (e.clientY - rect.top) / currentZoom;

  // Hit test in reverse z order (topmost first)
  const reversed = [...parsedElements].reverse();
  let hit = null;
  for (const el of reversed) {
    if (hitTest(el, mx, my)) { hit = el; break; }
  }

  selectedLine = hit ? hit.line : -1;
  render();
  if (hit) highlightEditorLine(hit.line);
});

function hitTest(el, mx, my) {
  switch (el.type) {
    case 'rect': return mx >= el.x && mx <= el.x + el.w && my >= el.y && my <= el.y + el.h;
    case 'img': return mx >= el.x && mx <= el.x + el.w && my >= el.y && my <= el.y + el.h;
    case 'text': return mx >= el.x && mx <= el.x + 300 && my >= el.y && my <= el.y + el.size;
    case 'voxi': return mx >= el.x && mx <= el.x + el.w && my >= el.y && my <= el.y + el.h;
    case 'ellipse': return ((mx-el.cx)/el.rx)**2 + ((my-el.cy)/el.ry)**2 <= 1;
    case 'line': {
      const dx = el.x2 - el.x1, dy = el.y2 - el.y1;
      const len = Math.sqrt(dx*dx + dy*dy);
      if (len === 0) return false;
      const t = Math.max(0, Math.min(1, ((mx-el.x1)*dx + (my-el.y1)*dy) / (len*len)));
      const px = el.x1 + t*dx, py = el.y1 + t*dy;
      return Math.sqrt((mx-px)**2 + (my-py)**2) < 6;
    }
  }
  return false;
}


// ── Editor ─────────────────────────────────────────────────────────

const editor = document.getElementById('editor');
const lineNumbersEl = document.getElementById('line-numbers');
const statusText = document.getElementById('status-text');
const elCount = document.getElementById('el-count');
const info = document.getElementById('info');

function updateLineNumbers() {
  const lines = editor.value.split('\n');
  lineNumbersEl.innerHTML = lines.map((_, i) => {
    const cls = i === selectedLine ? ' class="hl"' : '';
    return `<div${cls}>${i + 1}</div>`;
  }).join('');
}

editor.addEventListener('scroll', () => { lineNumbersEl.scrollTop = editor.scrollTop; });

let renderTimer = null;
editor.addEventListener('input', () => {
  updateLineNumbers();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(render, 120);
});

// Click in editor → deselect
editor.addEventListener('click', () => {
  // Figure out which line the cursor is on
  const pos = editor.selectionStart;
  const textBefore = editor.value.slice(0, pos);
  const lineIdx = textBefore.split('\n').length - 1;

  // Check if this line corresponds to an element
  const el = parsedElements.find(e => e.line === lineIdx);
  selectedLine = el ? lineIdx : -1;
  render();
});


// ── Mode buttons ───────────────────────────────────────────────────

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    render();
  });
});

document.getElementById('zoom').addEventListener('change', e => {
  currentZoom = Number(e.target.value);
  render();
});


// ── Export ──────────────────────────────────────────────────────────

document.getElementById('btn-export').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'ui-sketch.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
